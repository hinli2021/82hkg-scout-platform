<script id="key-data" type="application/json">{"schemaVersion":1,"quizId":"scout-member-badge-item4","answerIndexing":"0-based; based on the original options array in question-bank.json","answers":[{"id":"甲1","answerIndex":0,"explanation":"英文：Lord Robert Stephenson Smyth Baden-Powell of Gilwell。記憶法：三個 S —— Stephenson、Smyth、Scout！","reviewNote":null},{"id":"甲2","answerIndex":2,"explanation":"1895年，他平定西非洲阿善提王(Ashanti)的叛亂，當地人尊稱他為「不睡之狼」🐺。注意：舊版筆記誤印為1875年，正確年份是1895年。","reviewNote":null},{"id":"甲3","answerIndex":1,"explanation":"小隊制度(Patrol System)——後來成為童軍團最大特色：以小隊為中心！你還記得本旅設有哪些小隊嗎？","reviewNote":null},{"id":"甲4","answerIndex":2,"explanation":"《警探術》(Aids to Scouting)原為軍人而寫；其後有教師建議將內容改編為青少年版本，啟發了童軍運動的發展。","reviewNote":null},{"id":"甲5","answerIndex":3,"explanation":"南非梅富根城(Mafeking)。波爾戰爭期間，該城被圍困217日；他組織當地青年協助傳訊及急救工作，這些青年成為早期童軍活動的重要先驅。","reviewNote":null},{"id":"甲6","answerIndex":1,"explanation":"1901年升任少將，回國出任騎兵總監。他1907年舉辦實驗露營，之後辭去軍職全職推動童軍運動。","reviewNote":null},{"id":"甲7","answerIndex":1,"explanation":"他於1857年2月22日出生，1941年1月8日在肯雅逝世，享年83歲(按足歲計算；舊筆記採用虛歲，故列為84歲)。","reviewNote":null},{"id":"甲8","answerIndex":0,"explanation":"他於1857年2月22日出生於英國倫敦。有趣的是，他的妻子奧莉花也在2月22日生日，因此該日定為世界童軍懷念日。","reviewNote":null},{"id":"甲9","answerIndex":0,"explanation":"1916年，他為8至11歲兒童創立小狼活動(現稱幼童軍)，並於同年出版《小狼手冊》。樂行童軍則於1918年創立。","reviewNote":null},{"id":"甲10","answerIndex":2,"explanation":"1907年8月1日至9日，貝登堡在英國白浪島舉辦實驗露營，24名來自不同背景的兒童參加為期9日的營會，取得成功。童軍運動正式起航⛵","reviewNote":null},{"id":"甲11","answerIndex":3,"explanation":"1920年英國倫敦奧林匹亞會場。貝登堡在這次大露營被各國代表推選為世界童軍總領袖👑","reviewNote":null},{"id":"甲12","answerIndex":1,"explanation":"1920年，世界童軍會議與首屆大露營同年舉行；國際童軍辦事處亦於同年在倫敦設立。大露營以活動為主，世界童軍會議則討論運動發展。","reviewNote":null},{"id":"甲13","answerIndex":0,"explanation":"《小狼手冊》是配合幼童軍活動而出版。請勿混淆：警探術(軍人版)→童子警探(1908年童軍版)→小狼手冊(1916年幼童軍版)。","reviewNote":null},{"id":"甲14","answerIndex":0,"explanation":"該刊物於1921年創刊時名為《大露營》(Jamboree)，其後於1955年更名為《世界童軍運動》。Jamboree即指大露營。🏕️","reviewNote":null},{"id":"甲15","answerIndex":3,"explanation":"世界童軍總辦事處由加拿大 ex":0,"explanation":"答案以旅部最新公佈為準。","reviewNote":"請領袖核實：童軍團團長姓名"},{"id":"丙4","answerIndex":0,"explanation":"請觀察童軍團團長制服肩部的肩章。不同支部的領袖可能配戴不同顏色的肩章，以識別職務。","reviewNote":"請領袖核實：團長肩章顏色"},{"id":"丙5","answerIndex":1,"explanation":"筲箕灣區！我們的主辦機構是香港小童群益會康山兒童中心。","reviewNote":null},{"id":"丙6","answerIndex":0,"explanation":"本旅的組織層級為：第82旅→筲箕灣區→港島地域→香港童軍總會。(原卷此題須辨認區章圖片；請仔細查看制服上的區章圖案。)","reviewNote":null},{"id":"丙7","answerIndex":0,"explanation":"答案以區會最新公佈為準。區總監負責筲箕灣區的童軍事務。","reviewNote":"請領袖核實：區總監姓名"},{"id":"丙8","answerIndex":3,"explanation":"11–16歲。你目前屬於此年齡階段，15歲後可升讀深資童軍。","reviewNote":null},{"id":"丙9","answerIndex":1,"explanation":"童軍規律共七條，內容由「信用為人敬」至「自重又重人」。請勿與幼童軍的三句規律混淆。","reviewNote":null},{"id":"丙10","answerIndex":2,"explanation":"「我願以信譽為誓，竭盡所能；對神明，對國家，盡責任；對別人，樂於助人；對規律，必遵行。」誓詞講承諾，規律講品格。","reviewNote":null},{"id":"丙11","answerIndex":3,"explanation":"以小隊為中心——源自貝登堡1895年的小隊制度！我們有Tiger、Otter、Sea-gull三個小隊。","reviewNote":null},{"id":"丙12","answerIndex":3,"explanation":"專科徽章分為興趣、技能及服務三組。逐步累積徽章經驗，有助邁向總領袖獎章。","reviewNote":null},{"id":"丙13","answerIndex":1,"explanation":"總領袖獎章！注意：金紫荊獎章是幼童軍的最高榮譽獎章，會員章只是入門——請勿混淆！(認章小貼士：考試時須能辨認相關徽章，複習時亦可參閱筆記圖片。)","reviewNote":null},{"id":"丙14","answerIndex":0,"explanation":"請查看自己的旅巾，記下其顏色及款式。旅巾是本旅的識別標誌。","reviewNote":"請領袖核實：旅巾顏色"},{"id":"丙15","answerIndex":1,"explanation":"童軍支部的紀錄簿為綠色。不同支部使用不同顏色；升級時須更換相應紀錄簿，並妥善記錄已完成的考核。","reviewNote":null},{"id":"丙16","answerIndex":1,"explanation":"旅慶是全旅的紀念日，請記得參加慶祝活動。🎂","reviewNote":"請領袖核實：旅慶日期"},{"id":"丙17","answerIndex":3,"explanation":"Tiger🐯、Otter🦦及Sea-gull🕊️是本旅的三個小隊。你屬於哪一個小隊？","reviewNote":null},{"id":"丙18","answerIndex":2,"explanation":"「準備」(Be Prepared)是貝登堡留給世界童軍的銘言，提醒大家時刻作好準備。","reviewNote":null},{"id":"丙19","answerIndex":2,"explanation":"通常於11月舉行，是全港童軍參與步操檢閱的一項年度活動。","reviewNote":null},{"id":"丙20","answerIndex":1,"explanation":"請核對本旅設有哪些支部(小童軍、幼童軍、童軍、深資童軍及樂行童軍)，並在集會時留意其他支部的活動。","reviewNote":"請領袖核實：本旅支部數目"}]}</script>
<script>
/*
 * 第4項童軍會員章測驗引擎
 * 無第三方依賴；支援瀏覽器全域變數及 Node.js CommonJS。
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) {
    module.exports = api;
  } else {
    root.Item4QuizEngine = api;
  }
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  function shuffleCopy(items, rng) {
    const result = items.slice();
    const random = typeof rng === "function" ? rng : Math.random;
    for (let i = result.length - 1; i > 0; i -= 1) {
      const raw = Number(random());
      const safe = Number.isFinite(raw) ? Math.max(0, Math.min(0.999999999, raw)) : Math.random();
      const j = Math.floor(safe * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function validateBank(bank, answerKey) {
    assert(bank && typeof bank === "object", "題庫資料格式無效。");
    assert(Array.isArray(bank.questions) && bank.questions.length > 0, "題庫沒有題目。");
    assert(answerKey && typeof answerKey === "object" && Array.isArray(answerKey.answers), "答案資料格式無效。");
    assert(bank.quizId === answerKey.quizId, "題庫與答案鍵的 quizId 不相符。");

    const questionIds = new Set();
    for (const q of bank.questions) {
      assert(q && typeof q.id === "string" && q.id.length > 0, "每道題目均須有 id。");
      assert(!questionIds.has(q.id), `題目 id 重複：${q.id}`);
      questionIds.add(q.id);
      assert(typeof q.prompt === "string" && q.prompt.length > 0, `題目文字缺失：${q.id}`);
      assert(Array.isArray(q.options) && q.options.length >= 2, `選項數目不足：${q.id}`);
      assert(q.options.every(option => typeof option === "string"), `選項必須為文字：${q.id}`);
    }

    const keyById = new Map();
    for (const a of answerKey.answers) {
      assert(a && typeof a.id === "string", "答案鍵項目缺少 id。");
      assert(!keyById.has(a.id), `答案鍵 id 重複：${a.id}`);
      keyById.set(a.id, a);
    }
    for (const q of bank.questions) {
      const a = keyById.get(q.id);
      assert(a, `答案鍵缺少題目：${q.id}`);
      assert(Number.isInteger(a.answerIndex) && a.answerIndex >= 0 && a.answerIndex < q.options.length,
        `答案索引無效：${q.id}`);
    }
    return keyById;
  }

  /**
   * 建立一次作答。題目順序預設按題庫排列；選項預設隨機排列。
   * 傳回的 answerKey 必須留在伺服器端，切勿將它送到作答者的瀏覽器。
   */
  function createAttempt(questionBank, answerKey, settings) {
    const config = settings || {};
    const keyById = validateBank(questionBank, answerKey);
    const allowedParts = Array.isArray(config.parts) ? new Set(config.parts) : null;
    let sourceQuestions = questionBank.questions.filter(q => !allowedParts || allowedParts.has(q.partId));

    if (Array.isArray(config.questionIds)) {
      const chosen = new Set(config.questionIds);
      sourceQuestions = sourceQuestions.filter(q => chosen.has(q.id));
      assert(sourceQuestions.length === chosen.size, "指定題目中有不存在或不屬於所選部分的 id。");
    }

    const shuffleQuestions = config.shuffleQuestions == null
      ? !!(questionBank.defaults && questionBank.defaults.shuffleQuestions)
      : !!config.shuffleQuestions;
    const shuffleOptions = config.shuffleOptions == null
      ? !(questionBank.defaults && questionBank.defaults.shuffleOptions === false)
      : !!config.shuffleOptions;
    const rng = typeof config.rng === "function" ? config.rng : Math.random;
    if (shuffleQuestions) sourceQuestions = shuffleCopy(sourceQuestions, rng);

    const requestedCount = config.questionCount == null ? sourceQuestions.length : Number(config.questionCount);
    assert(Number.isInteger(requestedCount) && requestedCount > 0, "questionCount 必須是正整數。");
    assert(requestedCount <= sourceQuestions.length, "questionCount 大於可用題數。");
    sourceQuestions = sourceQuestions.slice(0, requestedCount);

    const pointsPerQuestion = Number(config.pointsPerQuestion == null
      ? questionBank.scoring.pointsPerQuestion
      : config.pointsPerQuestion);
    const passPercent = Number(config.passPercent == null
      ? questionBank.scoring.passPercent
      : config.passPercent);
    assert(Number.isFinite(pointsPerQuestion) && pointsPerQuestion > 0, "每題分數設定無效。");
    assert(Number.isFinite(passPercent) && passPercent >= 0 && passPercent <= 100, "合格百分比設定無效。");

    const maxScore = sourceQuestions.length * pointsPerQuestion;
    const passScore = config.passScore == null
      ? Math.ceil(maxScore * passPercent / 100)
      : Number(config.passScore);
    assert(Number.isFinite(passScore) && passScore >= 0 && passScore <= maxScore,
      "合格分數必須介乎 0 與滿分之間。");

    const privateKey = Object.create(null);
    const visibleQuestions = sourceQuestions.map(q => {
      const optionOrder = shuffleOptions
        ? shuffleCopy(q.options.map((_, index) => index), rng)
        : q.options.map((_, index) => index);
      const displayedOptions = optionOrder.map(index => q.options[index]);
      const sourceAnswer = keyById.get(q.id);
      const correctOptionIndex = optionOrder.indexOf(sourceAnswer.answerIndex);
      privateKey[q.id] = {
        correctOptionIndex,
        correctOptionText: displayedOptions[correctOptionIndex],
        explanation: sourceAnswer.explanation || "",
        reviewNote: sourceAnswer.reviewNote || null
      };
      return {
        id: q.id,
        order: q.order,
        partId: q.partId,
        partTitle: q.partTitle,
        prompt: q.prompt,
        options: displayedOptions,
        showColorSwatch: !!q.showColorSwatch
      };
    });

    const parts = (questionBank.parts || []).filter(part => visibleQuestions.some(q => q.partId === part.id));
    const quiz = {
      quizId: questionBank.quizId,
      title: questionBank.title,
      language: questionBank.language,
      questions: visibleQuestions,
      parts,
      scoring: {
        pointsPerQuestion,
        questionCount: visibleQuestions.length,
        maxScore,
        passScore,
        passPercent: maxScore ? Math.round(passScore / maxScore * 10000) / 100 : 0
      }
    };

    return { quiz, answerKey: privateKey };
  }

  function getResponse(responses, question, index) {
    let value;
    if (Array.isArray(responses)) value = responses[index];
    else if (responses && typeof responses === "object") value = responses[question.id];
    if (value && typeof value === "object") {
      value = value.selectedIndex == null ? value.choiceIndex : value.selectedIndex;
    }
    if (value == null || value === "") return null;
    const selected = Number(value);
    return Number.isInteger(selected) && selected >= 0 && selected < question.options.length ? selected : null;
  }

  /** responses 可用與題目順序對應的陣列，或以題目 id 為鍵的物件。 */
  function gradeAttempt(attempt, responses) {
    assert(attempt && attempt.quiz && Array.isArray(attempt.quiz.questions), "作答資料格式無效。");
    assert(attempt.answerKey && typeof attempt.answerKey === "object", "缺少作答答案鍵。");
    const quiz = attempt.quiz;
    const scoring = quiz.scoring;
    const sections = Object.create(null);
    for (const part of quiz.parts || []) {
      sections[part.id] = {
        partId: part.id,
        partTitle: part.title,
        questionCount: 0,
        correctCount: 0,
        score: 0,
        maxScore: 0
      };
    }

    let correctCount = 0;
    let answeredCount = 0;
    const review = quiz.questions.map((q, index) => {
      const key = attempt.answerKey[q.id];
      assert(key && Number.isInteger(key.correctOptionIndex), `作答答案鍵缺少題目：${q.id}`);
      const selectedIndex = getResponse(responses, q, index);
      const answered = selectedIndex !== null;
      const correct = answered && selectedIndex === key.correctOptionIndex;
      const section = sections[q.partId] || (sections[q.partId] = {
        partId: q.partId, partTitle: q.partTitle, questionCount: 0, correctCount: 0, score: 0, maxScore: 0
      });
      section.questionCount += 1;
      section.maxScore += scoring.pointsPerQuestion;
      if (answered) answeredCount += 1;
      if (correct) {
        correctCount += 1;
        section.correctCount += 1;
        section.score += scoring.pointsPerQuestion;
      }
      return {
        id: q.id,
        partId: q.partId,
        partTitle: q.partTitle,
        prompt: q.prompt,
        selectedIndex,
        selectedOption: answered ? q.options[selectedIndex] : null,
        correctOptionIndex: key.correctOptionIndex,
        correctOption: key.correctOptionText || q.options[key.correctOptionIndex],
        correct,
        unanswered: !answered,
        explanation: key.explanation || "",
        reviewNote: key.reviewNote || null
      };
    });

    const score = correctCount * scoring.pointsPerQuestion;
    return {
      quizId: quiz.quizId,
      title: quiz.title,
      score,
      maxScore: scoring.maxScore,
      passScore: scoring.passScore,
      correctCount,
      questionCount: quiz.questions.length,
      answeredCount,
      unansweredCount: quiz.questions.length - answeredCount,
      passed: score >= scoring.passScore,
      sections: Object.values(sections),
      review
    };
  }

  return { shuffleCopy, validateBank, createAttempt, gradeAttempt };
});

(function(){
  "use strict";
  const bank=JSON.parse(document.getElementById("bank-data").textContent);
  const key=JSON.parse(document.getElementById("key-data").textContent);
  const $=id=>document.getElementById(id);
  let attempt=null,answers=Object.create(null),current=0,secondsLeft=0,timerId=null,result=null,showAllReview=false;
  const letters=["A","B","C","D"];
  const colorMap={"綠色":"#0d7a3f","淺藍色":"#38a1db","紅色":"#d64545","黃色":"#e8a100","紫色":"#7c3aed"};
  function show(id){["setup","exam","results"].forEach(name=>$(name).classList.toggle("hidden",name!==id));window.scrollTo({top:0,behavior:"smooth"});}
  function start(){
    clearInterval(timerId);answers=Object.create(null);current=0;result=null;showAllReview=false;
    attempt=Item4QuizEngine.createAttempt(bank,key,{shuffleQuestions:false,shuffleOptions:true});
    secondsLeft=Number($("timeLimit").value)||0;show("exam");renderQuestion();
    if(secondsLeft>0){tick();timerId=setInterval(tick,1000);}else $("timer").textContent="不限時";
  }
  function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;$("timer").textContent=`剩餘 ${m}:${String(s).padStart(2,"0")}`;if(secondsLeft<=0){clearInterval(timerId);submit(true);return;}secondsLeft-=1;}
  function renderQuestion(){
    const q=attempt.quiz.questions[current];
    $("part").textContent=q.partTitle;
    $("count").textContent=`第 ${current+1} / ${attempt.quiz.questions.length} 題（${q.id}）`;
    const answered=Object.keys(answers).length;
    $("answered").textContent=`已作答 ${answered} / ${attempt.quiz.questions.length}`;
    $("progress").style.width=`${answered/attempt.quiz.questions.length*100}%`;
    $("prompt").textContent=q.prompt;
    const box=$("options");box.replaceChildren();
    q.options.forEach((text,index)=>{
      const b=document.createElement("button");b.type="button";b.className="option"+(answers[q.id]===index?" selected":"");
      const letter=document.createElement("span");letter.className="letter";letter.textContent=letters[index]||String(index+1);b.appendChild(letter);
      const content=document.createElement("span");
      if(q.showColorSwatch){const dot=document.createElement("span");dot.className="swatch";dot.style.backgroundColor=colorMap[text]||"#999";content.appendChild(dot);}
      content.appendChild(document.createTextNode(text));b.appendChild(content);
      b.addEventListener("click",()=>{answers[q.id]=index;renderQuestion();});box.appendChild(b);
    });
    $("prev").disabled=current===0;$("next").disabled=current===attempt.quiz.questions.length-1;
    const pal=$("palette");pal.replaceChildren();
    attempt.quiz.questions.forEach((item,i)=>{const b=document.createElement("button");b.type="button";b.className="pbtn"+(answers[item.id]!=null?" done":"")+(i===current?" current":"");b.textContent=String(i+1);b.setAttribute("aria-label",`第${i+1}題`);b.addEventListener("click",()=>{current=i;renderQuestion();});pal.appendChild(b);});
  }
  function submit(auto){
    if(!attempt)return;
    const answered=Object.keys(answers).length;
    if(!auto&&answered<attempt.quiz.questions.length&&!confirm(`尚有 ${attempt.quiz.questions.length-answered} 題未作答。提交後將顯示成績，確定提交？`))return;
    if(!auto&&answered===attempt.quiz.questions.length&&!confirm("確定提交答案？"))return;
    clearInterval(timerId);result=Item4QuizEngine.gradeAttempt(attempt,answers);renderResults();show("results");
  }
  function renderResults(){
    $("resultTitle").textContent=result.passed?"合格，恭喜完成測驗。":"測驗已完成，尚未達到合格分數。";
    $("score").textContent=`${result.score} / ${result.maxScore}`;$("score").classList.toggle("fail",!result.passed);
    $("resultSummary").textContent=`答對 ${result.correctCount} 題；已作答 ${result.answeredCount} 題；合格分數為 ${result.passScore} 分。`;
    const rows=$("sectionRows");rows.replaceChildren();
    result.sections.forEach(section=>{const tr=document.createElement("tr");[section.partTitle,`${section.correctCount} / ${section.questionCount}`,`${section.score} / ${section.maxScore}`].forEach(text=>{const td=document.createElement("td");td.textContent=text;tr.appendChild(td);});rows.appendChild(tr);});
    showAllReview=false;$("reviewList").classList.add("hidden");$("toggleReview").textContent="查看所有題目";renderReview();
  }
  function renderReview(){
    const root=$("reviewList");root.replaceChildren();
    const items=showAllReview?result.review:result.review.filter(item=>!item.correct);
    if(!items.length){const p=document.createElement("p");p.className="muted";p.textContent="沒有錯題，全部答對。";root.appendChild(p);return;}
    items.forEach(item=>{
      const card=document.createElement("article");card.className="review "+(item.correct?"right":"wrong");
      const h=document.createElement("h3");h.textContent=`${item.id}｜${item.prompt}`;card.appendChild(h);
      const mine=document.createElement("p");mine.className=item.correct?"correct":"incorrect";mine.textContent=`你的答案：${item.selectedOption==null?"未作答":item.selectedOption}`;card.appendChild(mine);
      if(!item.correct){const correct=document.createElement("p");correct.className="correct";correct.textContent=`正確答案：${item.correctOption}`;card.appendChild(correct);}
      if(item.explanation){const why=document.createElement("p");why.className="muted";why.textContent=`解說：${item.explanation}`;card.appendChild(why);}
      if(item.reviewNote){const note=document.createElement("p");note.className="small";note.textContent=`領袖核實提示：${item.reviewNote}`;card.appendChild(note);}
      root.appendChild(card);
    });
  }
  $("start").addEventListener("click",start);
  $("prev").addEventListener("click",()=>{if(current>0){current-=1;renderQuestion();}});
  $("next").addEventListener("click",()=>{if(current<attempt.quiz.questions.length-1){current+=1;renderQuestion();}});
  $("submit").addEventListener("click",()=>submit(false));
  $("quit").addEventListener("click",()=>{if(confirm("結束本次作答？尚未提交的答案不會保留。")){clearInterval(timerId);attempt=null;show("setup");}});
  $("toggleReview").addEventListener("click",()=>{showAllReview=!showAllReview;$("reviewList").classList.toggle("hidden",!showAllReview);$("toggleReview").textContent=showAllReview?"只查看錯題":"查看所有題目";renderReview();});
  $("retry").addEventListener("click",()=>show("setup"));
})();
</script>
