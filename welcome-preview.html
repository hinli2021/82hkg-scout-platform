<script>
/**
 * Game layer — sound, motion, progress rings, particles, the first-visit tour.
 * (Python edition: plain script, no imports; every page is server-rendered, so
 *   this only decorates what the page already contains.)
 *
 * Rules it follows:
 *  • No XP, no levels. Everything decorates the badge ladder that already
 *    exists — points stay on the 獎品 page.
 *  • No network, no assets: sounds are synthesised with the Web Audio API and
 *    the art is SVG/CSS, so the platform works offline and inside sandboxes.
 *  • Everything degrades quietly: no AudioContext, blocked storage, reduced
 *    motion, a sandboxed iframe — the site still runs, just calmer.
 */
(function () {
  'use strict';

  var PREF_KEY = 'scout.sound';
  var TOUR_KEY = 'scout.tourDone';

  /* ── storage that never throws (sandboxed iframes block it) ───────────── */
  function getItem(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function setItem(key, value) {
    try { window.localStorage.setItem(key, value); } catch (e) { /* ignore */ }
  }

  /* ── small DOM helpers ───────────────────────────────────────────────── */
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (name) {
      if (name === 'class') node.className = attrs[name];
      else if (name === 'style') node.setAttribute('style', attrs[name]);
      else if (name.slice(0, 2) === 'on' && typeof attrs[name] === 'function') node.addEventListener(name.slice(2), attrs[name]);
      else node.setAttribute(name, attrs[name]);
    });
    (children || []).forEach(function (child) {
      if (child === null || child === undefined) return;
      node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    });
    return node;
  }
  function clear(node) {
    while (node && node.firstChild) node.removeChild(node.firstChild);
    return node;
  }
  function lang() {
    return (document.documentElement.getAttribute('lang') || 'zh').slice(0, 2) === 'en' ? 'en' : 'zh';
  }
  function L(zh, en) { return lang() === 'en' ? (en || zh) : (zh || en); }

  /* ── sound ───────────────────────────────────────────────────────────── */
  var ctx = null;
  var pref = (function () {
    var saved = getItem(PREF_KEY);
    return saved === 'off' ? false : saved === 'on' ? true : null; // null → follow the unit default
  })();

  function soundOn() {
    if (pref !== null) return pref;
    try { return window.__scoutSoundDefault !== false; } catch (e) { return true; }
  }
  function setSound(on) {
    pref = !!on;
    setItem(PREF_KEY, pref ? 'on' : 'off');
    if (pref) sfx('tap');
    paintSoundToggle();
    return pref;
  }
  function toggleSound() { return setSound(!soundOn()); }

  function audio() {
    if (ctx) return ctx;
    try {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      ctx = new Ctor();
    } catch (e) { ctx = null; }
    return ctx;
  }

  function tone(freq, dur, opts) {
    opts = opts || {};
    var ac = audio();
    if (!ac) return;
    try {
      if (ac.state === 'suspended') ac.resume();
      var t0 = ac.currentTime + (opts.delay || 0);
      var osc = ac.createOscillator();
      var vol = ac.createGain();
      osc.type = opts.type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (opts.sweep) osc.frequency.exponentialRampToValueAtTime(Math.max(60, opts.sweep), t0 + dur);
      vol.gain.setValueAtTime(0.0001, t0);
      vol.gain.exponentialRampToValueAtTime(opts.gain || 0.05, t0 + 0.012);
      vol.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(vol).connect(ac.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) { /* a sound is a bonus — never break an interaction */ }
  }

  var RECIPES = {
    tap: function () { tone(620, 0.07, { type: 'triangle', gain: 0.035 }); },
    type: function () { tone(440, 0.03, { type: 'square', gain: 0.012 }); },
    correct: function () { tone(784, 0.1, { gain: 0.05 }); tone(1175, 0.16, { gain: 0.045, delay: 0.09 }); },
    wrong: function () { tone(300, 0.22, { type: 'sawtooth', gain: 0.035, sweep: 150 }); },
    tick: function () { tone(880, 0.05, { type: 'triangle', gain: 0.03 }); },
    submit: function () { tone(523, 0.1, { gain: 0.04 }); tone(659, 0.14, { gain: 0.04, delay: 0.08 }); },
    unlock: function () { tone(320, 0.5, { type: 'triangle', gain: 0.05, sweep: 1180 }); },
    badge: function () { [523, 659, 784, 1046].forEach(function (f, i) { tone(f, 0.28, { gain: 0.05, delay: i * 0.11 }); }); }
  };

  function sfx(name) {
    if (!soundOn()) return;
    var recipe = RECIPES[name];
    if (recipe) recipe();
  }

  /* ── motion ──────────────────────────────────────────────────────────── */
  function reducedMotion() {
    try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
    catch (e) { return false; }
  }

  function enter(node, index) {
    if (!node || reducedMotion()) return node;
    if (index) node.style.setProperty('--i', String(Math.min(index, 12)));
    node.classList.add('enter');
    return node;
  }

  /** Numbers that count up (overall %, points balance). */
  function countUp(node, to, opts) {
    if (!node) return;
    opts = opts || {};
    var ms = opts.ms || 700;
    var suffix = opts.suffix || '';
    var target = Number(to) || 0;
    if (reducedMotion() || typeof requestAnimationFrame !== 'function') {
      node.textContent = target + suffix;
      return;
    }
    // Read the clock ourselves — some environments use a different epoch for
    // the rAF timestamp, which used to freeze these numbers at 0.
    var clock = function () { return (typeof performance !== 'undefined' ? performance.now() : Date.now()); };
    var t0 = clock();
    var step = function () {
      var p = Math.max(0, Math.min(1, (clock() - t0) / ms));
      var eased = Math.max(0, 1 - Math.pow(1 - p, 3));
      node.textContent = Math.round(target * eased) + suffix;
      if (p < 1) requestAnimationFrame(step);
      else node.textContent = target + suffix;
    };
    requestAnimationFrame(step);
  }

  /** Circular progress ring (SVG). */
  function ring(percent, opts) {
    opts = opts || {};
    var size = opts.size || 96;
    var stroke = opts.stroke || 9;
    var toneName = opts.tone || 'green';
    var p = Math.max(0, Math.min(100, Math.round(Number(percent) || 0)));
    var r = (size - stroke) / 2;
    var c = 2 * Math.PI * r;
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    svg.setAttribute('width', String(size));
    svg.setAttribute('height', String(size));
    svg.setAttribute('class', 'ring tone-' + toneName);
    function mk(cls) {
      var circle = document.createElementNS(NS, 'circle');
      circle.setAttribute('cx', String(size / 2));
      circle.setAttribute('cy', String(size / 2));
      circle.setAttribute('r', String(r));
      circle.setAttribute('fill', 'none');
      circle.setAttribute('stroke-width', String(stroke));
      circle.setAttribute('class', cls);
      return circle;
    }
    var fill = mk('ring-fill');
    fill.setAttribute('stroke-dasharray', String(c));
    fill.setAttribute('stroke-dashoffset', String(c));
    fill.setAttribute('stroke-linecap', 'round');
    fill.setAttribute('transform', 'rotate(-90 ' + size / 2 + ' ' + size / 2 + ')');
    svg.appendChild(mk('ring-track'));
    svg.appendChild(fill);

    var centre = opts.centre ? el('strong', {}, [opts.centre]) : el('strong', {}, [p + '%']);
    var wrap = el('div', { class: 'ring-wrap' + (toneName === 'brass' ? ' is-brass' : '') }, [
      svg,
      el('div', { class: 'ring-centre' }, [centre, opts.sub ? el('span', { class: 'ring-sub' }, [opts.sub]) : null])
    ]);
    var paint = function () { fill.setAttribute('stroke-dashoffset', String(c * (1 - p / 100))); };
    if (typeof requestAnimationFrame === 'function' && !reducedMotion()) {
      requestAnimationFrame(function () { requestAnimationFrame(paint); });
    } else { paint(); }
    return wrap;
  }

  /** Fills every <span data-ring="56"> placeholder a template leaves behind. */
  function hydrateRings(root) {
    (root || document).querySelectorAll('[data-ring]').forEach(function (node) {
      var percent = node.getAttribute('data-ring');
      var size = Number(node.getAttribute('data-ring-size')) || 96;
      var toneName = node.getAttribute('data-ring-tone') || 'green';
      var sub = node.getAttribute('data-ring-sub') || null;
      node.appendChild(ring(percent, { size: size, tone: toneName, sub: sub }));
      node.classList.add('ring-slot');
    });
  }

  function hydrateCounters(root) {
    (root || document).querySelectorAll('[data-countup]').forEach(function (node) {
      countUp(node, node.getAttribute('data-countup'), { suffix: node.getAttribute('data-countup-suffix') || '' });
    });
  }

  /** A short particle burst around an element (task complete, badge unlock). */
  function burst(anchor, count, emojis) {
    if (!anchor || !anchor.getBoundingClientRect || reducedMotion()) return;
    var rect = anchor.getBoundingClientRect();
    if (!rect.width && !rect.height) return; // hidden element
    count = count || 14;
    emojis = emojis || ['✨', '⭐', '🎉'];
    var root = document.getElementById('fx-root') || document.body;
    for (var i = 0; i < count; i++) {
      (function (i) {
        var node = el('span', {
          class: 'fx-bit',
          style: 'left:' + (rect.left + rect.width / 2) + 'px;' +
                 'top:' + (rect.top + rect.height / 2) + 'px;' +
                 '--dx:' + ((Math.random() - 0.5) * 220) + 'px;' +
                 '--dy:' + (-40 - Math.random() * 140) + 'px;' +
                 '--rot:' + ((Math.random() - 0.5) * 240) + 'deg;' +
                 'animation-delay:' + (Math.random() * 0.12) + 's'
        }, [emojis[i % emojis.length]]);
        root.appendChild(node);
        setTimeout(function () { node.remove(); }, 1100);
      })(i);
    }
  }

  /** Ripple + press feedback for anything tappable. */
  function pressable(node, opts) {
    if (!node || node.dataset.pressable === '1') return node;
    opts = opts || {};
    node.dataset.pressable = '1';
    node.classList.add('pressable');
    node.addEventListener('pointerdown', function (ev) {
      node.classList.add('pressed');
      if (opts.sound !== false) sfx(opts.sound || 'tap');
      if (reducedMotion() || !node.getBoundingClientRect) return;
      var rect = node.getBoundingClientRect();
      if (!rect.width) return;
      var dot = el('span', {
        class: 'ripple',
        style: 'left:' + ((ev.clientX || rect.left + rect.width / 2) - rect.left) + 'px;' +
               'top:' + ((ev.clientY || rect.top + rect.height / 2) - rect.top) + 'px;'
      });
      node.appendChild(dot);
      setTimeout(function () { dot.remove(); }, 560);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (name) {
      node.addEventListener(name, function () { node.classList.remove('pressed'); });
    });
    return node;
  }

  /* ── first-visit tour (once per device, scout pages only) ────────────── */
  var TOUR_STEPS = [
    {
      emoji: '🎖',
      zh: ['這是你的獎章旅程', '每格是一個獎章。點一下打開，完成裡面的任務就可以考獲。'],
      en: ['This is your badge journey', 'Each tile is an award. Tap one to open it — finish the tasks inside to earn it.'],
      href: function (urls) { return urls.badges; }
    },
    {
      emoji: '🗺️',
      zh: ['「獎章」頁是一條路線', '看得到自己走到哪裡、下一個獎章還差多少。順序完成就自動考獲。'],
      en: ['The Badges page is the trail', 'See where you are and how far the next award is. Finish in order and it is awarded automatically.'],
      href: function (urls) { return urls.home; }
    },
    {
      emoji: '🔥',
      zh: ['每天完成一件事', '連續活躍會累積火苗，龍虎榜按考獲獎章排名 — 看看你的小隊在哪裡！'],
      en: ['Do one thing a day', 'Consecutive days build a streak. The leaderboard ranks earned badges — see where your patrol is!'],
      href: function (urls) { return urls.leaderboard; }
    }
  ];

  function maybeShowTour(urls) {
    if (getItem(TOUR_KEY) === '1') return false;
    if (!urls || !urls.home) return false;
    if (document.getElementById('tour-root')) return false; // never stack two tours

    var i = 0;
    var root = el('div', { class: 'tour-backdrop', id: 'tour-root' });
    var card = el('div', { class: 'tour-card' });
    root.appendChild(card);

    function finish() {
      setItem(TOUR_KEY, '1');
      root.remove();
      document.removeEventListener('keydown', onKey);
    }
    function onKey(ev) { if (ev.key === 'Escape') finish(); }

    function paint() {
      var step = TOUR_STEPS[i];
      clear(card).appendChild(el('div', {}, [
        el('div', { class: 'tour-emoji' }, [step.emoji]),
        el('h2', {}, [L(step.zh[0], step.en[0])]),
        el('p', { class: 'muted' }, [L(step.zh[1], step.en[1])]),
        el('div', { class: 'tour-dots' }, TOUR_STEPS.map(function (_, k) {
          return el('span', { class: 'tour-dot' + (k === i ? ' on' : '') });
        })),
        el('div', { class: 'row' }, [
          el('button', { class: 'btn ghost', type: 'button', onclick: finish }, [L('略過', 'Skip')]),
          el('button', {
            class: 'btn primary grow', type: 'button',
            onclick: function () {
              sfx('tap');
              if (i === TOUR_STEPS.length - 1) { finish(); return; }
              var target = step.href(urls);
              i += 1;
              if (target) { window.location.href = target; return; } // real page, real URL
              paint();
            }
          }, [L('下一步', 'Next')])
        ])
      ]));
    }

    paint();
    document.body.appendChild(root);
    document.addEventListener('keydown', onKey);
    return true;
  }

  function resetTour() { setItem(TOUR_KEY, '0'); }

  /* ── HUD sound toggle ────────────────────────────────────────────────── */
  function paintSoundToggle() {
    document.querySelectorAll('[data-sound-toggle]').forEach(function (button) {
      var on = soundOn();
      button.textContent = on ? '🔊' : '🔇';
      button.classList.toggle('off', !on);
      button.setAttribute('aria-pressed', on ? 'true' : 'false');
      button.title = on ? L('遊戲音效：開', 'Game sound: on') : L('遊戲音效：關', 'Game sound: off');
    });
  }

  /* ── boot: decorate whatever this page rendered ──────────────────────── */
  function init() {
    document.querySelectorAll('.card, .stat, .badge-tile, .quest-node, .chest, .lb-row').forEach(function (node, i) {
      enter(node, i);
    });
    hydrateRings();
    hydrateCounters();
    document.querySelectorAll('.btn, .badge-tile, .quest-node, .chest, .pill, .name-tile').forEach(function (node) {
      pressable(node);
    });
    document.querySelectorAll('[data-sound-toggle]').forEach(function (button) {
      button.addEventListener('click', function () { toggleSound(); });
    });
    paintSoundToggle();
    if (document.body.dataset.tour === '1') {
      maybeShowTour({
        home: document.body.dataset.urlHome,
        badges: document.body.dataset.urlBadges,
        leaderboard: document.body.dataset.urlLeaderboard
      });
    }
  }

  window.FX = {
    sfx: sfx, soundOn: soundOn, setSound: setSound, toggleSound: toggleSound,
    reducedMotion: reducedMotion, enter: enter, countUp: countUp, ring: ring,
    burst: burst, pressable: pressable, maybeShowTour: maybeShowTour, resetTour: resetTour,
    hydrateRings: hydrateRings, hydrateCounters: hydrateCounters, L: L, lang: lang
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>

  <script>
/**
 * Scout pages — the interactive layer on top of server-rendered forms.
 *
 * Every form here works with JavaScript switched off (it posts and the server
 * redirects). When JS *is* running we take over: submit by fetch, keep the
 * scout on the task, play the feedback sound, fire the confetti and offer the
 * next task. Progressive enhancement, never a requirement.
 */
(function () {
  'use strict';
  var FX = window.FX;

  /* ── feedback: a result the server just handed back ───────────────────── */
  function showFeedback(kind, zh, en, events) {
    var box = document.getElementById('task-feedback');
    if (!box) return;
    var lang = FX.lang();
    box.className = 'card ' + (kind === 'success' ? 'feedback-ok' : kind === 'warn' ? 'feedback-warn' : '');
    box.innerHTML = '';
    var title = document.createElement('div');
    title.className = 'feedback-title';
    title.textContent = (lang === 'en' ? en : zh) || zh || en;
    box.appendChild(title);
    if (kind === 'success') {
      var trophy = document.createElement('div');
      trophy.className = 'feedback-emoji';
      trophy.textContent = '🎉';
      box.insertBefore(trophy, title);
      FX.burst(box, 18);
      FX.sfx('correct');
    } else if (kind === 'warn') {
      FX.sfx('wrong');
    }
    (events || []).forEach(function (ev) {
      if (ev.type === 'badge') {
        var line = document.createElement('div');
        line.className = 'feedback-badge';
        line.textContent = '🎖 ' + (lang === 'en' ? 'Badge earned! ' : '考獲獎章！') +
          (ev.badge ? (lang === 'en' ? ev.badge.title_en : ev.badge.title_zh) : '');
        box.appendChild(line);
        FX.sfx('badge');
        FX.burst(box, 26, ['🎖', '✨', '⭐']);
      } else if (ev.type === 'points' && ev.points) {
        var pts = document.createElement('div');
        pts.className = 'muted small';
        pts.textContent = (lang === 'en' ? 'Points earned: ' : '獲得積分：') + ev.points;
        box.appendChild(pts);
      }
    });
    box.classList.remove('hidden');
    box.scrollIntoView({ behavior: FX.reducedMotion() ? 'auto' : 'smooth', block: 'center' });
  }

  /* ── the task player ─────────────────────────────────────────────────── */
  function initTask() {
    var form = document.querySelector('form[data-task-submit]');
    if (!form) return;

    // Quiz: light up answered questions, block a silent submission.
    form.querySelectorAll('.quiz-question').forEach(function (question) {
      question.querySelectorAll('.radio-row input').forEach(function (radio) {
        radio.addEventListener('change', function () {
          question.classList.add('answered');
          question.querySelectorAll('.radio-row').forEach(function (row) { row.classList.remove('picked'); });
          var picked = radio.closest('.radio-row');
          if (picked) picked.classList.add('picked');
          FX.sfx('tick');
          paintDots();
        });
      });
    });
    var dots = document.getElementById('quiz-dots');
    function paintDots() {
      if (!dots) return;
      var questions = form.querySelectorAll('.quiz-question');
      var answered = form.querySelectorAll('.quiz-question.answered').length;
      dots.querySelectorAll('.q-dot').forEach(function (dot, i) {
        dot.classList.toggle('on', i < answered);
      });
      var label = dots.querySelector('.quiz-dots-label');
      if (label) label.textContent = answered + ' / ' + questions.length;
    }
    paintDots();

    // Checklist: count ticks and enable submission when everything is ticked.
    var checklist = form.querySelector('[data-checklist]');
    if (checklist) {
      checklist.querySelectorAll('input[type=checkbox]').forEach(function (box) {
        box.addEventListener('change', function () {
          FX.sfx(box.checked ? 'tick' : 'tap');
          paintChecklist();
        });
      });
      paintChecklist();
    }
    function paintChecklist() {
      if (!checklist) return;
      var boxes = checklist.querySelectorAll('input[type=checkbox]');
      var done = checklist.querySelectorAll('input[type=checkbox]:checked').length;
      var meter = checklist.querySelector('[data-checklist-count]');
      if (meter) meter.textContent = done + ' / ' + boxes.length;
    }

    // Evidence: choose a photo → upload → keep the link in the hidden field.
    var file = form.querySelector('input[type=file][data-upload]');
    if (file) {
      file.addEventListener('change', function () {
        var chosen = file.files && file.files[0];
        if (!chosen) return;
        var status = document.getElementById('upload-status');
        if (status) status.textContent = FX.L('上載中…', 'Uploading…');
        var reader = new FileReader();
        reader.onload = function () {
          fetch(withSid('/upload'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'fetch' },
            body: JSON.stringify({
              filename: chosen.name, mimeType: chosen.type || 'image/jpeg', dataUrl: reader.result
            })
          }).then(function (res) { return res.json(); }).then(function (data) {
            if (data.ok) {
              var hidden = form.querySelector('input[name=evidence_url]');
              if (hidden) hidden.value = data.url;
              if (status) status.innerHTML = '';
              if (status) {
                var link = document.createElement('a');
                link.href = data.url; link.target = '_blank'; link.rel = 'noopener';
                link.textContent = FX.L('已上載 ✓ 查看相片', 'Uploaded ✓ view photo');
                status.appendChild(link);
              }
              FX.sfx('unlock');
            } else if (status) {
              status.textContent = FX.lang() === 'en' ? (data.message_en || 'Upload failed') : (data.message_zh || '上載失敗');
              FX.sfx('wrong');
            }
          }).catch(function () {
            if (status) status.textContent = FX.L('上載失敗，請再試一次', 'Upload failed — please try again');
          });
        };
        reader.readAsDataURL(chosen);
      });
    }

    // Submit by fetch so the scout stays on the page and sees the result.
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var button = form.querySelector('button[type=submit]');
      if (button) { button.disabled = true; button.classList.add('busy'); }
      FX.sfx('submit');

      if (form.dataset.quiz === '1' && form.dataset.requireAll === '1') {
        var total = form.querySelectorAll('.quiz-question').length;
        var answered = form.querySelectorAll('.quiz-question.answered').length;
        if (answered < total) {
          FX.sfx('wrong');
          showFeedback('warn', '還有題目未回答（' + answered + ' / ' + total + '）', 'Answer every question first (' + answered + ' / ' + total + ')');
          if (button) { button.disabled = false; button.classList.remove('busy'); }
          return;
        }
      }

      fetch(form.action, {
        method: 'POST',
        headers: { 'X-Requested-With': 'fetch', 'Accept': 'application/json' },
        body: new FormData(form)
      }).then(function (res) { return res.json().then(function (data) { return { status: res.status, data: data }; }); })
        .then(function (result) {
          var data = result.data || {};
          if (result.status >= 400) {
            showFeedback('warn', data.message_zh || '未能提交', data.message_en || 'Could not submit');
            return;
          }
          showFeedback(data.passed ? 'success' : (data.status === 'pending' ? 'info' : 'warn'),
            data.feedback_zh, data.feedback_en, data.events);
          if (data.passed) {
            // Progress moved — refresh the rings and let the scout pick what to do next.
            paintBadgeChip(data.progress);
            addNextAction(data);
          } else if (data.record_id) {
            // A redo: re-enable the form so they can try again right away.
            window.setTimeout(function () { window.location.reload(); }, 2200);
          }
        })
        .catch(function () {
          showFeedback('warn', '網絡問題，請再試一次', 'Network hiccup — please try again');
        })
        .then(function () {
          if (button) { button.disabled = false; button.classList.remove('busy'); }
        });
    });
  }

  function paintBadgeChip(progress) {
    if (!progress || !progress.badges) return;
    progress.badges.forEach(function (badge) {
      var meter = document.querySelector('[data-badge-meter="' + badge.id + '"]');
      if (meter) meter.textContent = badge.tasks_done + ' / ' + badge.tasks_total;
      var bar = document.querySelector('[data-badge-bar="' + badge.id + '"]');
      if (bar) bar.style.width = badge.percent + '%';
    });
    var overall = document.querySelector('[data-overall-percent]');
    if (overall && progress.overall) overall.textContent = progress.overall.percent + '%';
  }

  function addNextAction(data) {
    var panel = document.getElementById('next-action');
    if (!panel) return;
    panel.innerHTML = '';
    panel.classList.remove('hidden');
    var next = data.progress && data.progress.overall && data.progress.overall.next_task;
    var row = document.createElement('div');
    row.className = 'row wrap';
    var back = document.createElement('a');
    back.className = 'btn';
    back.href = '/badges';
    back.textContent = FX.L('回到獎章路線', 'Back to the trail');
    row.appendChild(back);
    if (next && next.task) {
      var go = document.createElement('a');
      go.className = 'btn primary';
      go.href = '/tasks/' + next.task.id;
      go.textContent = FX.L('下一個任務：', 'Next task: ') + (FX.lang() === 'en' ? next.task.title_en : next.task.title_zh);
      FX.pressable(go);
      row.appendChild(go);
    }
    panel.appendChild(row);
  }

  /* ── a result flashed by the server after a plain (no-JS) post ────────── */
  /* Inside the preview iframe cookies are refused, so the sign-in token also
     travels in the address bar — keep it on URLs the page builds itself. */
  function withSid(url) {
    var hit = location.search.match(/[?&]sid=([^&]+)/);
    if (!hit || /[?&]sid=/.test(url)) return url;
    return url + (url.indexOf('?') > -1 ? '&' : '?') + 'sid=' + hit[1];
  }

  /* ── a page that arrived with good news (e.g. a password just set) ───── */
  function initCelebration() {
    var node = document.querySelector('[data-celebrate]');
    if (!node) return;
    FX.sfx('unlock');
    FX.burst(node, 26, ['🎉', '✨', '🔐']);
  }

  function initServerFeedback() {
    var node = document.getElementById('server-feedback');
    if (!node) return;
    try {
      var data = JSON.parse(node.getAttribute('data-feedback') || '{}');
      if (!data.zh && !data.en) return;
      showFeedback(data.kind === 'success' ? 'success' : 'warn', data.zh, data.en, data.events);
    } catch (e) { /* nothing to do */ }
  }

  /* ── rewards page: chest cost meters ─────────────────────────────────── */
  function initRewards() {
    document.querySelectorAll('[data-chest]').forEach(function (chest) {
      chest.addEventListener('click', function () {
        if (chest.classList.contains('locked')) {
          FX.sfx('wrong');
          var note = chest.querySelector('.chest-note');
          if (note) { note.classList.add('shake'); setTimeout(function () { note.classList.remove('shake'); }, 500); }
        } else {
          FX.sfx('unlock');
          FX.burst(chest, 12);
        }
      });
    });
  }

  /* ── leaderboard: highlight me ───────────────────────────────────────── */
  function initBoard() {
    var me = document.querySelector('.lb-row.is-me');
    if (me) { FX.enter(me); if (FX.soundOn()) FX.sfx('tap'); }
  }

  function boot() {
    initTask();
    initCelebration();
    initServerFeedback();
    initRewards();
    initBoard();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
