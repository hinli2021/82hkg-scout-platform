
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your password · Scout Progress Platform</title>
  <style>
/* ==========================================================================
   Scout Progress Platform — design system
   Palette: deep scout green, brass/amber accents, warm parchment surfaces.
   Mobile-first; every interactive target ≥ 44px.
   ========================================================================== */
:root {
  --green-900: #0b2317;
  --green-800: #0f2e1d;
  --green-700: #17452c;
  --green-600: #1f5c3a;
  --green-500: #2c7d4f;
  --green-400: #4aa96c;
  --green-100: #e6f2ea;
  --brass: #d9a441;
  --brass-dark: #b6822a;
  --brass-light: #f6d68a;
  --ink: #1b2320;
  --ink-soft: #4a5a53;
  --muted: #7b8a84;
  --paper: #fbfaf6;
  --paper-2: #f3f1ea;
  --line: #e2e0d6;
  --white: #fff;
  --danger: #b3261e;
  --danger-bg: #fdecea;
  --ok: #1f7a45;
  --ok-bg: #e7f6ec;
  --warn: #8a6100;
  --warn-bg: #fdf3dc;
  --info: #23527c;
  --info-bg: #e8f1fa;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-lg: 24px;
  --shadow-sm: 0 1px 2px rgba(16, 34, 24, .08), 0 2px 8px rgba(16, 34, 24, .05);
  --shadow: 0 6px 20px rgba(16, 34, 24, .12);
  --shadow-lg: 0 18px 50px rgba(11, 35, 23, .28);
  --font: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .4rem; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 .6rem; }
a { color: var(--green-600); }
code { background: var(--paper-2); padding: .1rem .35rem; border-radius: 6px; font-size: .85em; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.center { text-align: center; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: .75rem; }
.row { display: flex; gap: .6rem; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: .6rem; }
.grow { flex: 1; }
.grid { display: grid; gap: 1rem; }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }

/* ── boot ───────────────────────────────────────────────────────────── */
.boot { min-height: 100vh; display: grid; place-content: center; text-align: center; color: var(--muted); }
.boot-flag { font-size: 3rem; animation: float 1.8s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

/* ── login ──────────────────────────────────────────────────────────── */
.login { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
@media (min-width: 900px) { .login { grid-template-columns: 1.1fr .9fr; } }
.login-art {
  display: none; background: radial-gradient(120% 100% at 20% 10%, var(--green-600), var(--green-900));
  place-content: center; position: relative; overflow: hidden;
}
@media (min-width: 900px) { .login-art { display: grid; } }
.scout-badge-art { font-size: 9rem; filter: drop-shadow(0 12px 30px rgba(0,0,0,.35)); animation: float 5s ease-in-out infinite; }
.login-glow { position: absolute; inset: 0; background: radial-gradient(50% 50% at 70% 80%, rgba(217,164,65,.28), transparent); }
.login-card { margin: auto; width: min(430px, 92vw); padding: 1.75rem; }
.login-title { font-size: 1.5rem; margin-bottom: .1rem; }
.login-sub { margin-bottom: 1.2rem; }
.demo-hint { margin-top: 1rem; padding: .7rem .9rem; border: 1px dashed var(--brass); border-radius: var(--radius-sm); background: #fffaf0; font-size: .82rem; }
.demo-hint code { background: var(--white); }
details.demo-hint summary { cursor: pointer; font-weight: 700; color: var(--green-700); }
details.demo-hint[open] summary { margin-bottom: .2rem; }
.demo-hint p { line-height: 1.6; }

/* ── screens ────────────────────────────────────────────────────────── */
.screen { padding: 1.5rem; min-height: 100vh; display: flex; }
.setup-card, .narrow { margin: auto; width: min(560px, 94vw); padding: 1.75rem; }
.steps { display: flex; gap: .4rem; margin-bottom: 1rem; }
.steps .dot { width: 26px; height: 5px; border-radius: 4px; background: var(--line); }
.steps .dot.active { background: var(--green-500); }

/* ── cards & surfaces ───────────────────────────────────────────────── */
.card {
  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1.1rem; box-shadow: var(--shadow-sm);
}
.card.tight { padding: .8rem; }
.card.pad-lg { padding: 1.5rem; }
.card-note { background: var(--info-bg); border-color: #cfe0ef; }
.card-warn { background: var(--warn-bg); border-color: #f0dfb4; }
.panel { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.panel-head { padding: .85rem 1rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: .5rem; background: var(--paper-2); }
.panel-body { padding: 1rem; }
.stat { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem; }
.stat .k { font-size: .78rem; color: var(--muted); text-transform: none; }
.stat .v { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
.divider { height: 1px; background: var(--line); margin: .9rem 0; }

/* ── buttons ────────────────────────────────────────────────────────── */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--white); color: var(--ink);
  padding: .62rem 1rem; border-radius: 999px; font-size: .95rem; font-weight: 600;
  cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  transition: transform .06s ease, box-shadow .15s ease, background .15s ease, border-color .15s;
  text-decoration: none;
}
.btn:hover { box-shadow: var(--shadow-sm); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--green-600); border-color: var(--green-600); color: #fff; }
.btn.primary:hover { background: var(--green-500); }
.btn.brass { background: var(--brass); border-color: var(--brass); color: #3d2a05; }
.btn.brass:hover { background: var(--brass-light); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: #ecc8c5; }
.btn.danger:hover { background: var(--danger-bg); }
.btn.small { padding: .35rem .75rem; font-size: .82rem; min-height: 36px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
.icon-btn {
  border: 1px solid var(--line); background: var(--white); width: 40px; height: 40px; border-radius: 50%;
  cursor: pointer; font-size: 1.05rem; display: grid; place-items: center;
}
.lang-switch { display: flex; gap: .25rem; justify-content: flex-end; margin-bottom: .5rem; }
.lang-switch button {
  border: 1px solid var(--line); background: var(--white); color: var(--ink-soft);
  padding: .25rem .6rem; font-size: .78rem; border-radius: 999px; cursor: pointer;
}
.lang-switch button.active { background: var(--green-600); border-color: var(--green-600); color: #fff; font-weight: 700; }

/* ── forms ──────────────────────────────────────────────────────────── */
.field { display: block; margin-bottom: .8rem; }
.field > span { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .3rem; color: var(--ink-soft); }
.field .hint { font-weight: 400; color: var(--muted); font-size: .78rem; }
input[type="text"], input[type="password"], input[type="number"], input[type="date"], input[type="url"], select, textarea {
  width: 100%; padding: .62rem .75rem; border: 1px solid var(--line); border-radius: var(--radius-sm);
  font-size: .95rem; font-family: inherit; background: var(--white); color: var(--ink); min-height: 44px;
}
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--green-400); outline-offset: 1px; border-color: var(--green-400); }
.switch { display: flex; align-items: center; gap: .55rem; padding: .45rem 0; cursor: pointer; }
.switch input { width: 20px; height: 20px; accent-color: var(--green-600); }
.radio-row { display: flex; align-items: flex-start; gap: .6rem; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: .45rem; cursor: pointer; background: var(--white); }
.radio-row:hover { border-color: var(--green-400); }
.radio-row.correct { border-color: var(--ok); background: var(--ok-bg); }
.choices { display: grid; gap: .4rem; }
.inline-form { display: flex; gap: .5rem; flex-wrap: wrap; align-items: flex-end; }
.inline-form .field { margin-bottom: 0; }

/* ── alerts ─────────────────────────────────────────────────────────── */
.alert { padding: .7rem .9rem; border-radius: var(--radius-sm); font-size: .88rem; margin-bottom: .8rem; }
.alert.error { background: var(--danger-bg); color: var(--danger); border: 1px solid #f2cdc9; }
.alert.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid #c8e6d3; }
.alert.info { background: var(--info-bg); color: var(--info); border: 1px solid #cfe0ef; }
.alert.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid #f0dfb4; }

/* ── topbar / HUD ───────────────────────────────────────────────────── */
.topbar { position: sticky; top: 0; z-index: 40; background: linear-gradient(160deg, var(--green-800), var(--green-700)); color: #fff; box-shadow: var(--shadow); }
.topbar-inner { display: flex; align-items: center; gap: .75rem; padding: .55rem .9rem; max-width: 1180px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: .55rem; background: none; border: 0; color: #fff; cursor: pointer; text-align: left; padding: 0; }
.brand .flag { font-size: 1.5rem; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong { font-size: .95rem; }
.brand-text small { color: #a9c9b6; font-size: .72rem; }
.tabbar { display: flex; gap: .2rem; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.tabbar::-webkit-scrollbar { display: none; }
.tabbar button {
  background: transparent; border: 0; color: #cfe3d7; font-size: .86rem; font-weight: 600; padding: .5rem .7rem;
  border-radius: 999px; cursor: pointer; white-space: nowrap;
}
.tabbar button:hover { background: rgba(255,255,255,.1); color: #fff; }
.tabbar button.active { background: var(--brass); color: #36250a; }
.topbar-right { display: flex; align-items: center; gap: .4rem; }
.topbar-right .lang-switch { margin: 0; }
.topbar-right .lang-switch button { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); color: #dfeae3; }
.topbar-right .lang-switch button.active { background: var(--brass); border-color: var(--brass); color: #36250a; }
.topbar-right .icon-btn { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); color: #fff; }

.hud { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: .9rem; padding: .1rem .9rem .6rem; flex-wrap: wrap; }
.hud-avatar { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; font-size: 1.5rem; border: 2px solid var(--brass); }
.hud-name { font-weight: 700; font-size: .95rem; }
.hud-sub { font-size: .74rem; color: #a9c9b6; }
.hud-chips { display: flex; gap: .4rem; flex-wrap: wrap; }
.chip {
  background: rgba(255,255,255,.12); border-radius: 999px; padding: .22rem .65rem; font-size: .78rem; font-weight: 600;
  display: inline-flex; align-items: center; gap: .3rem; white-space: nowrap;
}
.chip.brass { background: var(--brass); color: #36250a; }
.chip.light { background: var(--paper-2); color: var(--ink-soft); border: 1px solid var(--line); }
.chip.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid #c8e6d3; }
.chip.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid #f0dfb4; }
.chip.danger { background: var(--danger-bg); color: var(--danger); border: 1px solid #f2cdc9; }
.chip.info { background: var(--info-bg); color: var(--info); border: 1px solid #cfe0ef; }

/* ── view ───────────────────────────────────────────────────────────── */
.view { max-width: 1180px; margin: 0 auto; padding: 1.1rem .9rem 3rem; }
.view-head { display: flex; justify-content: space-between; align-items: flex-end; gap: .8rem; margin-bottom: 1rem; flex-wrap: wrap; }
.view-head .sub { color: var(--muted); font-size: .88rem; }
.section { margin-bottom: 1.6rem; }
.section > h2 { display: flex; align-items: center; gap: .5rem; margin-bottom: .7rem; }
.footer { max-width: 1180px; margin: 0 auto; padding: 1rem .9rem 2.5rem; display: flex; justify-content: space-between; gap: 1rem; color: var(--muted); font-size: .78rem; flex-wrap: wrap; }

/* ── badges ─────────────────────────────────────────────────────────── */
.badge-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); }
.badge-card {
  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1.1rem;
  cursor: pointer; position: relative; overflow: hidden; transition: transform .12s ease, box-shadow .18s ease;
  display: flex; flex-direction: column; gap: .6rem;
}
.badge-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.badge-card.locked { opacity: .62; }
.badge-card.earned { border-color: var(--brass); background: linear-gradient(180deg, #fffdf6, #fff); }
.badge-top { display: flex; gap: .75rem; align-items: center; }
.badge-emoji {
  width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; font-size: 1.75rem;
  background: var(--green-100); flex-shrink: 0;
}
.badge-emoji.solid { color: #fff; }
.badge-title { font-weight: 700; font-size: 1.02rem; line-height: 1.25; }
.badge-sub { font-size: .76rem; color: var(--muted); }
.badge-desc { font-size: .85rem; color: var(--ink-soft); flex: 1; }
.progress-track { height: 9px; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--green-500), var(--green-400)); border-radius: 999px; transition: width .7s cubic-bezier(.2,.8,.2,1); }
.progress-fill.done { background: linear-gradient(90deg, var(--brass-dark), var(--brass)); }
.badge-foot { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; color: var(--muted); }
.ribbon {
  position: absolute; top: 12px; right: -30px; transform: rotate(38deg); background: var(--brass); color: #36250a;
  font-size: .7rem; font-weight: 800; padding: .18rem 2.2rem; letter-spacing: .04em;
}
.locked-note { display: flex; align-items: center; gap: .35rem; font-size: .78rem; color: var(--warn); background: var(--warn-bg); padding: .3rem .6rem; border-radius: 999px; }

/* ── tasks ──────────────────────────────────────────────────────────── */
.task-list { display: flex; flex-direction: column; gap: .6rem; }
.task-row {
  display: flex; gap: .8rem; align-items: center; padding: .8rem .9rem; border: 1px solid var(--line);
  border-radius: var(--radius-sm); background: var(--white); cursor: pointer; transition: border-color .15s, background .15s;
}
.task-row:hover { border-color: var(--green-400); background: #fbfefc; }
.task-row.done { background: var(--ok-bg); border-color: #c8e6d3; }
.task-row.pending { background: var(--warn-bg); border-color: #f0dfb4; }
.task-row.rejected { background: var(--danger-bg); border-color: #f2cdc9; }
.task-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--paper-2); display: grid; place-items: center; font-size: 1.15rem; flex-shrink: 0; }
.task-main { flex: 1; min-width: 0; }
.task-title { font-weight: 650; font-size: .95rem; }
.task-meta { font-size: .78rem; color: var(--muted); display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.task-reward { font-size: .8rem; font-weight: 700; color: var(--brass-dark); white-space: nowrap; }
.task-state { font-size: 1.2rem; }

/* ── leaderboard ────────────────────────────────────────────────────── */
.lb-list { display: flex; flex-direction: column; gap: .5rem; }
.lb-row { display: flex; align-items: center; gap: .75rem; padding: .7rem .9rem; border: 1px solid var(--line); background: var(--white); border-radius: var(--radius-sm); }
.lb-row.me { border-color: var(--green-500); background: #f4fbf6; box-shadow: inset 0 0 0 1px var(--green-400); }
.lb-rank { width: 40px; text-align: center; font-weight: 800; font-size: 1rem; color: var(--muted); flex-shrink: 0; }
.lb-rank.top1 { color: var(--brass-dark); font-size: 1.35rem; }
.lb-rank.top2 { color: #8e9aa2; font-size: 1.25rem; }
.lb-rank.top3 { color: #a9744f; font-size: 1.15rem; }
.lb-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--green-100); display: grid; place-items: center; font-size: 1.2rem; flex-shrink: 0; }
.lb-name { font-weight: 650; }
.lb-sub { font-size: .76rem; color: var(--muted); }
.lb-metric { text-align: right; margin-left: auto; }
.lb-metric .big { font-weight: 800; font-size: 1.05rem; }
.lb-metric .lbl { font-size: .72rem; color: var(--muted); }
.podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-bottom: 1rem; }
.podium .p { text-align: center; padding: .9rem .4rem; border-radius: var(--radius); border: 1px solid var(--line); background: var(--white); }
.podium .p.first { border-color: var(--brass); background: linear-gradient(180deg, #fffdf4, #fff); transform: translateY(-6px); box-shadow: var(--shadow); }
.podium .medal { font-size: 1.9rem; }
.podium .nm { font-weight: 700; font-size: .9rem; margin-top: .2rem; }
.podium .xp { font-size: .78rem; color: var(--brass-dark); font-weight: 700; }

/* ── tables ─────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); }
table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 640px; }
th { text-align: left; padding: .7rem .8rem; background: var(--paper-2); font-size: .78rem; color: var(--ink-soft); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: .65rem .8rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #fcfdfb; }
.avatar-cell { display: flex; align-items: center; gap: .5rem; }

/* ── modal ──────────────────────────────────────────────────────────── */
.modal-backdrop { position: fixed; inset: 0; background: rgba(11,35,23,.55); backdrop-filter: blur(3px); z-index: 100; display: flex; align-items: flex-end; justify-content: center; padding: 0; animation: fade .18s ease; }
@media (min-width: 700px) { .modal-backdrop { align-items: center; padding: 1.5rem; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--white); width: 100%; max-width: 620px; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  max-height: 92vh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: slideup .22s cubic-bezier(.2,.8,.2,1);
}
@media (min-width: 700px) { .modal { border-radius: var(--radius-lg); max-height: 88vh; } }
@keyframes slideup { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.modal-head { padding: 1rem 1.1rem; border-bottom: 1px solid var(--line); display: flex; gap: .75rem; align-items: center; }
.modal-head h2 { margin: 0; font-size: 1.1rem; }
.modal-body { padding: 1.1rem; overflow-y: auto; }
.modal-foot { padding: .9rem 1.1rem; border-top: 1px solid var(--line); display: flex; gap: .6rem; justify-content: flex-end; background: var(--paper-2); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.modal-close { margin-left: auto; }

/* ── toast ──────────────────────────────────────────────────────────── */
.toast-root { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: .5rem; width: min(92vw, 420px); }
.toast { background: var(--ink); color: #fff; padding: .7rem .9rem; border-radius: var(--radius-sm); font-size: .88rem; box-shadow: var(--shadow); animation: slideup .2s ease; }
.toast.ok { background: var(--ok); }
.toast.error { background: var(--danger); }
.toast.warn { background: var(--brass-dark); }

/* ── celebration ────────────────────────────────────────────────────── */
.celebrate-root { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; background: rgba(11,35,23,.72); backdrop-filter: blur(4px); }
.celebrate-card { background: var(--white); border-radius: var(--radius-lg); padding: 1.8rem; text-align: center; width: min(420px, 92vw); box-shadow: var(--shadow-lg); animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.celebrate-emoji { font-size: 3.6rem; animation: float 2s ease-in-out infinite; }
.celebrate-xp { font-size: 1.9rem; font-weight: 800; color: var(--brass-dark); }
.confetti { position: fixed; top: -12px; width: 10px; height: 14px; z-index: 310; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .9; } }

/* ── misc ───────────────────────────────────────────────────────────── */
.pill-tabs { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: .9rem; }
.pill-tabs button { border: 1px solid var(--line); background: var(--white); border-radius: 999px; padding: .4rem .85rem; font-size: .84rem; cursor: pointer; font-weight: 600; color: var(--ink-soft); }
.pill-tabs button.active { background: var(--green-600); border-color: var(--green-600); color: #fff; }
.emoji-pick { display: flex; gap: .3rem; flex-wrap: wrap; }
.emoji-pick button { font-size: 1.2rem; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--white); cursor: pointer; }
.emoji-pick button.active { border-color: var(--green-500); background: var(--green-100); }
.hr-list { list-style: none; padding: 0; margin: 0; }
.hr-list li { padding: .6rem 0; border-bottom: 1px dashed var(--line); display: flex; gap: .7rem; align-items: flex-start; }
.hr-list li:last-child { border-bottom: 0; }
.ledger-plus { color: var(--ok); font-weight: 700; }
.ledger-minus { color: var(--danger); font-weight: 700; }
.evidence-thumb { max-width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--line); }
.q-editor { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .8rem; margin-bottom: .7rem; background: var(--paper-2); }
.drag-handle { cursor: grab; color: var(--muted); user-select: none; }
.bar-mini { display: inline-block; width: 80px; height: 7px; border-radius: 999px; background: var(--paper-2); overflow: hidden; vertical-align: middle; }
.bar-mini i { display: block; height: 100%; background: var(--green-500); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Content editor: badge list + editor panel (single column on phones) */
.master-detail { display: grid; gap: 1rem; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 960px) { .master-detail { grid-template-columns: 340px minmax(0, 1fr); } }

/* ── quick demo panel on the login screen ───────────────────────────── */
.demo-panel {
  margin-top: 1rem; padding: .9rem; border-radius: var(--radius-sm);
  border: 1px solid var(--brass); background: linear-gradient(180deg, #fffdf5, #fff8e8);
}
.demo-head { font-weight: 700; font-size: .92rem; margin-bottom: .55rem; color: var(--brass-dark); }
.demo-buttons { display: grid; gap: .5rem; grid-template-columns: 1fr 1fr; }
.demo-hint-text { margin: .6rem 0 0; line-height: 1.5; }
.boot-error { max-width: 460px; margin: 1rem auto 0; text-align: left; font-size: .86rem; }

/* Separator between the demo panel and the real sign-in form */
.login-sep {
  display: flex; align-items: center; gap: .6rem; margin: 1rem 0 .9rem;
  color: var(--muted); font-size: .78rem; white-space: nowrap;
}
.login-sep::before, .login-sep::after { content: ''; height: 1px; background: var(--line); flex: 1; }

/* ══════════════════════════════════════════════════════════════════════════
   Scout home page — square badge tiles, compact summaries, suggestion cards
   ══════════════════════════════════════════════════════════════════════════ */
.home-hello { display: flex; justify-content: space-between; align-items: flex-end; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
.home-hello h1 { margin-bottom: .1rem; }
.home-hello .sub { color: var(--muted); font-size: .88rem; }

/* two compact summary cards side by side, stacked on phones */
.home-summary { margin-bottom: 1.4rem; }
.home-card { display: flex; flex-direction: column; gap: .55rem; }
.home-card-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.home-card-head h3 { margin: 0; font-size: 1rem; }
.big-metric { display: flex; align-items: baseline; gap: .5rem; }
.big-metric-value { font-size: 2.1rem; font-weight: 800; line-height: 1; color: var(--green-700); }
.big-metric-label { font-size: .82rem; color: var(--muted); }
.mini-rows { display: flex; flex-direction: column; gap: .3rem; margin-top: .2rem; }
.mini-row { display: flex; justify-content: space-between; gap: .5rem; font-size: .86rem; padding: .25rem 0; border-bottom: 1px dashed var(--line); }
.mini-row:last-child { border-bottom: 0; }
.mini-row-label { color: var(--ink-soft); }
.mini-row-value { font-weight: 700; }
.mini-row-value.ok { color: var(--ok); }
.section-head { margin-bottom: .7rem; }


/* ── square badge buttons ─────────────────────────────────────────────── */
.badge-tiles { display: grid; gap: .8rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 560px) { .badge-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 900px) { .badge-tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.badge-tile {
  aspect-ratio: 1 / 1; position: relative; overflow: hidden; cursor: pointer;
  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: .8rem .7rem 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: .45rem; text-align: center; transition: transform .12s ease, box-shadow .18s ease, border-color .15s;
}
.badge-tile:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--green-400); }
.badge-tile:active { transform: translateY(0); }
.badge-tile.locked { opacity: .58; background: var(--paper-2); }
.badge-tile.earned { border-color: var(--brass); background: linear-gradient(180deg, #fffdf5, #fff); }
.tile-state { position: absolute; top: .5rem; right: .6rem; font-size: 1.05rem; }
.tile-emoji {
  width: 62px; height: 62px; border-radius: 20px; display: grid; place-items: center; font-size: 1.9rem;
  color: #fff; flex-shrink: 0;
}
.badge-tile.locked .tile-emoji { filter: grayscale(.65); }
.tile-title { font-weight: 700; font-size: .9rem; line-height: 1.22; }
.tile-meta { font-size: .74rem; color: var(--muted); }
.badge-tile.earned .tile-meta { color: var(--brass-dark); font-weight: 700; }
.tile-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--paper-2); }
.tile-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--green-500), var(--green-400)); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.tile-bar > i.done { background: linear-gradient(90deg, var(--brass-dark), var(--brass)); }

/* ── suggestion cards ─────────────────────────────────────────────────── */
.suggest-grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.suggest-card {
  background: var(--white); border: 1px solid var(--line); border-left: 5px solid var(--green-500);
  border-radius: var(--radius); padding: .85rem .9rem; display: flex; flex-direction: column; gap: .5rem;
  justify-content: space-between;
}
.suggest-card.auto { background: linear-gradient(180deg, #f7fcf9, #fff); border-left-color: var(--brass); }
.suggest-card.cat-learn { border-left-color: #2f6f9f; }
.suggest-card.cat-skill { border-left-color: var(--green-500); }
.suggest-card.cat-outdoor { border-left-color: #6b8f3a; }
.suggest-card.cat-service { border-left-color: #b07d2b; }
.suggest-card.cat-creative { border-left-color: #8d5ba8; }
.suggest-card.cat-fun { border-left-color: #c2603f; }
.suggest-emoji { font-size: 1.6rem; line-height: 1; flex-shrink: 0; }
.suggest-title { font-weight: 700; font-size: .95rem; line-height: 1.3; }
.suggest-desc { font-size: .84rem; color: var(--ink-soft); margin: .25rem 0 0; }
.suggest-foot { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; }
.suggest-kind { font-size: .72rem; color: var(--muted); text-transform: none; }
.suggest-card.auto .suggest-kind { color: var(--brass-dark); font-weight: 700; }

/* compact notice line */
.notice-line { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .6rem .8rem; display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; }
.notice-line.pinned { border-color: var(--brass); background: #fffaf0; }

/* ── badge artwork ────────────────────────────────────────────────────── */
/* Official progressive-award images (public/img/badges). The coloured emoji
   chip stays as the fallback whenever a badge has no image_url.            */
.tile-emoji.plate,
.badge-emoji.plate {
  background: radial-gradient(circle at 50% 30%, #ffffff 0%, var(--paper-2) 84%);
  box-shadow: inset 0 0 0 1px var(--line);
}
.tile-emoji.plate .badge-art { width: 88%; height: 88%; }
.badge-emoji.plate .badge-art { width: 84%; height: 84%; }
.badge-art { object-fit: contain; display: block; filter: drop-shadow(0 3px 6px rgba(12, 34, 24, .22)); }
.badge-tile.locked .tile-emoji.plate { opacity: .6; }
.badge-tile.locked .tile-emoji.plate .badge-art { filter: grayscale(.75) opacity(.75); }
.celebrate-art { width: 96px; height: 96px; margin: 0 auto; }
.award-art { width: 40px; height: 40px; }
.task-icon.has-art { background: var(--paper-2); }
.badge-thumb { width: 30px; height: 30px; object-fit: contain; display: block; }

/* artwork picker in the leader console */
.art-picker { display: flex; gap: .45rem; flex-wrap: wrap; align-items: center; }
.art-choice {
  width: 54px; height: 54px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--white); display: grid; place-items: center; cursor: pointer; padding: 5px;
}
.art-choice img { width: 100%; height: 100%; object-fit: contain; display: block; }
.art-choice.active { border-color: var(--green-500); box-shadow: 0 0 0 3px var(--green-100); }
.art-preview { width: 54px; height: 54px; object-fit: contain; background: var(--paper-2); border-radius: 14px; padding: 5px; flex-shrink: 0; }
.art-note { font-size: .72rem; color: var(--muted); line-height: 1.35; }

/* ── sign-in: two doors (scout picker / leader) ───────────────────────── */
.login-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; background: var(--paper-2); padding: .28rem; border-radius: 14px; margin-bottom: .9rem; }
.login-tab {
  border: 0; background: transparent; padding: .55rem .4rem; border-radius: 11px; cursor: pointer;
  font-weight: 700; font-size: .92rem; color: var(--muted);
}
.login-tab.active { background: var(--white); color: var(--green-700); box-shadow: 0 2px 8px rgba(12, 34, 24, .1); }
.patrol-pills { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .7rem; }
.patrol-pill {
  border: 1px solid var(--line); background: var(--white); color: var(--ink-soft);
  border-radius: 999px; padding: .32rem .7rem; font-size: .82rem; font-weight: 650; cursor: pointer;
}
.patrol-pill.active { background: var(--green-600, var(--green-500)); border-color: transparent; color: #fff; }
#scout-name { font-weight: 650; }
.link-btn {
  display: block; width: 100%; margin-top: .55rem; border: 0; background: transparent;
  color: var(--green-700); font-size: .85rem; font-weight: 650; cursor: pointer; text-decoration: underline;
  text-underline-offset: 3px;
}
.forgot-panel { margin-top: .6rem; padding: .7rem .8rem; border: 1px dashed var(--line); border-radius: 12px; background: var(--paper-2); }
.forgot-panel .alert { margin-top: .5rem; }

/* pending «forgot password» requests in the leader console */
.reset-banner { border-left: 5px solid var(--brass-dark); }
.reset-row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.reset-row .grow { min-width: 160px; }

/* ══════════════════════════════════════════════════════════════════════════
   GAME LAYER — motion, rings, quest map, tour, particles.
   Everything is CSS/SVG only: no images, no fonts, no network, and it all
   switches off under prefers-reduced-motion.
   ═════════════════════════════════════════════════════════════════════════ */

/* ── entrance + press feedback ────────────────────────────────────────── */
@keyframes enterUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.enter { animation: enterUp .38s cubic-bezier(.2,.9,.3,1) backwards; animation-delay: calc(var(--i, 0) * 55ms); }
.pressable { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
.pressable.pressed { transform: scale(.975); }
.ripple {
  position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
  background: currentColor; opacity: .25; pointer-events: none; animation: ripple .55s ease-out forwards;
}
@keyframes ripple { to { transform: scale(18); opacity: 0; } }

/* ── progress ring ────────────────────────────────────────────────────── */
.ring-wrap { position: relative; display: inline-grid; place-items: center; flex-shrink: 0; }
.ring { display: block; }
.ring-track { stroke: var(--paper-2); }
.ring-fill { stroke: var(--green-500); transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
.ring.tone-brass .ring-fill { stroke: var(--brass); }
.ring-centre { position: absolute; text-align: center; line-height: 1.05; }
.ring-centre strong { font-size: 1.45rem; font-weight: 800; }
.ring-sub { display: block; font-size: .62rem; color: var(--muted); }
.ring-wrap.is-brass .ring-centre strong { color: var(--brass-dark); }

/* ── particles ────────────────────────────────────────────────────────── */
.fx-bit {
  position: fixed; z-index: 320; pointer-events: none; font-size: 1.1rem;
  animation: fxFly .95s ease-out forwards;
}
@keyframes fxFly {
  0% { transform: translate(-50%, -50%) scale(.6); opacity: 0; }
  25% { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot)); opacity: 0; }
}

/* ── shimmer placeholders ─────────────────────────────────────────────── */
.skel-wrap { display: grid; gap: .6rem; }
.skel { height: 54px; border-radius: var(--radius); background: linear-gradient(90deg, var(--paper-2) 25%, #f2f4f0 37%, var(--paper-2) 63%); background-size: 400% 100%; animation: shimmer 1.3s ease-in-out infinite; }
.skel-lg { height: 110px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

/* ── quest map (獎章進度) ─────────────────────────────────────────────── */
.quest-map { position: relative; display: grid; gap: 1.35rem; padding: 1.1rem .4rem 1.1rem 0; }
.quest-map::before {
  content: ''; position: absolute; left: 39px; top: 30px; bottom: 30px; width: 4px; border-radius: 4px;
  background: repeating-linear-gradient(180deg, var(--green-400) 0 9px, transparent 9px 18px);
}
.quest-node { position: relative; display: flex; align-items: center; gap: .95rem; cursor: pointer; padding-left: .15rem; }
.quest-node .node-art {
  position: relative; width: 78px; height: 78px; border-radius: 24px; flex-shrink: 0; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 32%, #fff 0%, var(--paper-2) 82%);
  box-shadow: inset 0 0 0 2px var(--line), var(--shadow-sm); z-index: 1;
}
.quest-node .node-art .badge-art { width: 84%; height: 84%; }
.quest-node .node-badge {
  position: absolute; right: -6px; bottom: -6px; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-size: .92rem; background: var(--paper-2); border: 2px solid var(--white);
}
.quest-node.done .node-art { box-shadow: inset 0 0 0 2px var(--brass), 0 0 0 3px rgba(217,164,65,.18), var(--shadow-sm); }
.quest-node.done .node-badge { background: var(--brass); }
.quest-node.current .node-art { box-shadow: inset 0 0 0 2px var(--green-500), 0 0 0 4px rgba(44,125,79,.16); }
.quest-node.current .node-badge { background: var(--green-500); color: #fff; }
.quest-node.current::after {
  content: ''; position: absolute; left: 40px; top: 50%; width: 78px; height: 78px; transform: translate(-50%, -50%);
  border-radius: 26px; border: 2px solid var(--green-400); animation: pulseRing 2.1s ease-out infinite;
}
@keyframes pulseRing { 0% { opacity: .55; transform: translate(-50%, -50%) scale(1); } 70%,100% { opacity: 0; transform: translate(-50%, -50%) scale(1.22); } }
.quest-node.locked { cursor: default; }
.quest-node.locked .node-art { box-shadow: inset 0 0 0 2px var(--line); opacity: .72; }
.quest-node.locked .node-art .badge-art, .quest-node.locked .node-art > span { filter: grayscale(.85); }
.quest-node.locked .node-body { opacity: .72; }
.quest-node .node-body { flex: 1; min-width: 0; }
.quest-node .node-title { font-weight: 750; font-size: 1rem; }
.quest-node .node-sub { font-size: .78rem; color: var(--muted); }
.quest-node .node-meta { display: flex; align-items: center; gap: .4rem; margin-top: .3rem; flex-wrap: wrap; }
.quest-node .node-bar { height: 7px; border-radius: 999px; background: var(--paper-2); overflow: hidden; margin-top: .4rem; max-width: 320px; }
.quest-node .node-bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--green-500), var(--green-400)); transition: width 1s cubic-bezier(.2,.8,.2,1); }
.quest-node.done .node-bar > i { background: linear-gradient(90deg, var(--brass-dark), var(--brass)); }
.quest-node .node-go { font-size: 1.3rem; color: var(--green-600); }

/* ── badge tiles: livelier ────────────────────────────────────────────── */
.badge-tile { transition: transform .16s ease, box-shadow .16s ease; }
.badge-tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.badge-tile.earned { box-shadow: inset 0 0 0 2px rgba(217,164,65,.35); }
.badge-tile.next { box-shadow: inset 0 0 0 2px var(--green-400), 0 6px 18px rgba(44,125,79,.16); }
.badge-tile.next::after {
  content: '▶'; position: absolute; top: .35rem; left: .45rem; font-size: .7rem; color: var(--green-600);
  animation: float 1.6s ease-in-out infinite;
}

/* ── task player ──────────────────────────────────────────────────────── */
.q-dots { display: flex; gap: .3rem; flex-wrap: wrap; margin: .2rem 0 .6rem; }
.q-dot { width: 26px; height: 8px; border-radius: 999px; background: var(--paper-2); transition: background .2s ease, transform .2s ease; }
.q-dot.on { background: var(--green-500); transform: scaleY(1.2); }
.radio-row { transition: transform .12s ease, border-color .12s ease, background .12s ease; }
.radio-row:active { transform: scale(.99); }
.radio-row.picked { border-color: var(--green-500); background: var(--green-100); }
.radio-row.flash-ok { animation: flashOk .6s ease; }
.radio-row.flash-bad { animation: flashBad .5s ease; }
@keyframes flashOk { 0%,100% { background: var(--ok-bg); } 50% { background: #cdeed6; } }
@keyframes flashBad { 0%,100% { border-color: #ecc8c5; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.task-hint { display: flex; align-items: center; gap: .5rem; font-size: .8rem; color: var(--muted); }
.task-hint .dot-on { color: var(--green-600); font-weight: 700; }

/* ── leaderboard ──────────────────────────────────────────────────────── */
.lb-row { position: relative; overflow: hidden; }
.lb-row .lb-fill {
  position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, rgba(44,125,79,.14), rgba(44,125,79,.03));
  transition: width 1.1s cubic-bezier(.2,.8,.2,1); z-index: 0;
}
.lb-row > * { position: relative; z-index: 1; }
.lb-row.me .lb-fill { background: linear-gradient(90deg, rgba(217,164,65,.22), rgba(217,164,65,.05)); }
.podium .p { animation: enterUp .5s cubic-bezier(.2,.9,.3,1) backwards; }
.podium .p:nth-child(1) { animation-delay: .05s; }
.podium .p:nth-child(2) { animation-delay: .12s; }
.podium .p:nth-child(3) { animation-delay: .19s; }

/* ── rewards: the treasure page (the only place points are shown) ─────── */
.wallet-hero {
  display: flex; align-items: center; gap: 1rem; padding: 1.1rem 1.2rem; border-radius: var(--radius-lg);
  background: linear-gradient(120deg, #fffaf0, #fff 60%); border: 1px solid var(--brass-light);
}
.wallet-hero .coins { font-size: 2.6rem; animation: float 3s ease-in-out infinite; }
.wallet-hero .amount { font-size: 2rem; font-weight: 800; color: var(--brass-dark); line-height: 1.05; }
.chest { position: relative; transition: transform .16s ease, box-shadow .16s ease; }
.chest:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.chest .chest-art { font-size: 2rem; filter: drop-shadow(0 4px 8px rgba(12,34,24,.18)); }
.chest.locked { opacity: .78; }
.chest.affordable { box-shadow: inset 0 0 0 2px rgba(217,164,65,.35); }
.wallet-note { font-size: .78rem; color: var(--muted); }

/* ── timeline (history) ───────────────────────────────────────────────── */
.tl { list-style: none; margin: 0; padding: 0 0 0 1.4rem; position: relative; }
.tl::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.tl li { position: relative; padding: .5rem 0; }
.tl li::before {
  content: ''; position: absolute; left: -1.35rem; top: .95rem; width: 11px; height: 11px; border-radius: 50%;
  background: var(--white); border: 2px solid var(--green-400);
}
.tl li.badge-item::before { border-color: var(--brass); background: var(--brass-light); }

/* ── HUD sound toggle ─────────────────────────────────────────────────── */
.hud-sound { width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); cursor: pointer; font-size: .95rem; }
.hud-sound.off { opacity: .55; }
.chip.streak-hot { background: linear-gradient(120deg, #ffe9c9, #fff3e2); color: #8a4b00; }
.chip.streak-hot .flame { display: inline-block; animation: float 1.5s ease-in-out infinite; }

/* ── first-visit tour ─────────────────────────────────────────────────── */
.tour-backdrop {
  position: fixed; inset: 0; z-index: 400; background: rgba(12, 34, 24, .55);
  display: grid; place-items: center; padding: 1.2rem; animation: fade .25s ease;
}
.tour-card {
  background: var(--white); border-radius: var(--radius-lg); padding: 1.5rem 1.4rem; width: min(430px, 94vw);
  text-align: center; box-shadow: var(--shadow-lg); animation: pop .32s cubic-bezier(.2,1.4,.4,1);
}
.tour-emoji { font-size: 3rem; animation: float 2.4s ease-in-out infinite; }
.tour-card h2 { margin: .4rem 0 .3rem; }
.tour-dots { display: flex; gap: .3rem; justify-content: center; margin: .9rem 0; }
.tour-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.tour-dot.on { background: var(--green-500); transform: scale(1.25); }

/* ── quick actions (leader console) ───────────────────────────────────── */
.quick-actions { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.quick-action {
  display: flex; align-items: center; gap: .6rem; text-align: left; cursor: pointer;
  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: .8rem .9rem;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.quick-action:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--green-400); }
.quick-action .qa-ico { font-size: 1.4rem; }
.quick-action .qa-num { margin-left: auto; font-weight: 800; color: var(--brass-dark); }

/* ── reduced motion: calm everything down ─────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
  .fx-bit, .ripple { display: none !important; }
}
.view-enter { animation: enterUp .3s cubic-bezier(.2,.9,.3,1); }
.hello-avatar {
  width: 52px; height: 52px; border-radius: 18px; display: grid; place-items: center; font-size: 1.6rem;
  background: radial-gradient(circle at 50% 30%, #fff, var(--paper-2)); box-shadow: inset 0 0 0 1px var(--line);
}
.home-hello .btn.primary { align-self: flex-start; }

/* ==========================================================================
   PYTHON EDITION — server-rendered additions
   (the design system above is shared with the Node build; this block adds the
    pieces that only exist when pages arrive from the server: real <a> nav,
    page forms, the review queue, quiz dots and the result banner)
   ========================================================================== */

/* ── navigation: real links, same look as the SPA tabs ────────────────── */
.tabbar a {
  background: transparent; border: 0; color: #cfe3d7; font-size: .86rem; font-weight: 700;
  padding: .5rem .7rem; border-radius: 999px; cursor: pointer; white-space: nowrap;
  text-decoration: none; display: inline-flex; align-items: center; gap: .35rem;
}
.tabbar a:hover { background: rgba(255,255,255,.1); color: #fff; }
.tabbar a.active { background: var(--brass); color: #36250a; }
.tabbar a .logout { opacity: .75; }

.lang-switch { display: inline-flex; gap: .3rem; }
.lang-switch a {
  text-decoration: none; font-size: .78rem; font-weight: 700; padding: .3rem .6rem; border-radius: 999px;
  border: 1px solid var(--line); background: var(--white); color: var(--ink-soft);
}
.lang-switch a.active { background: var(--brass); border-color: var(--brass); color: #36250a; }
.topbar-right .lang-switch a { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); color: #dfeae3; }
.topbar-right .lang-switch a.active { background: var(--brass); border-color: var(--brass); color: #36250a; }
.icon-btn {
  appearance: none; border: 1px solid var(--line); background: var(--white); border-radius: 999px;
  width: 40px; height: 40px; display: grid; place-items: center; font-size: 1.05rem; cursor: pointer;
}
.topbar-right .icon-btn { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); color: #fff; }

/* ── page chrome ──────────────────────────────────────────────────────── */
.page { max-width: 1180px; margin: 0 auto; padding: 1.1rem .9rem 3rem; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: .8rem; flex-wrap: wrap; margin-bottom: 1rem; }
.crumbs { font-size: .82rem; color: var(--muted); margin-bottom: .35rem; }
.crumbs a { color: var(--green-600); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.breadcrumb-arrow { margin: 0 .3rem; }
.section-title { display: flex; align-items: center; gap: .5rem; margin: 1.4rem 0 .7rem; }
.section-title h2 { margin: 0; }
.section-title .count { font-size: .8rem; color: var(--muted); font-weight: 600; }
.empty {
  border: 1px dashed var(--line); border-radius: var(--radius); padding: 1.4rem; text-align: center;
  color: var(--muted); background: var(--paper-2);
}
.empty .empty-emoji { font-size: 2rem; display: block; margin-bottom: .4rem; }

/* ── auth: patrol & name tiles ────────────────────────────────────────── */
.tile-grid { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.name-tile {
  display: flex; align-items: center; gap: .6rem; padding: .85rem 1rem; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--white); text-decoration: none; color: var(--ink);
  font-weight: 700; box-shadow: var(--shadow-sm);
}
.name-tile:hover { border-color: var(--green-400); transform: translateY(-1px); }
.name-tile .avatar { font-size: 1.4rem; }
.patrol-tile {
  display: block; text-align: center; padding: 1.1rem .8rem; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--white); text-decoration: none; color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.patrol-tile:hover { border-color: var(--green-400); transform: translateY(-2px); }
.patrol-tile .patrol-emoji { font-size: 2rem; display: block; }
.patrol-tile .patrol-en { font-size: .74rem; color: var(--muted); }

/* ── task player: quiz & checklist ───────────────────────────────────── */
.quiz-question { border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1rem; background: var(--white); margin-bottom: .8rem; }
.quiz-question.answered { border-color: var(--green-400); box-shadow: 0 0 0 3px rgba(74,169,108,.12); }
.quiz-question .q-num { font-size: .74rem; font-weight: 800; color: var(--brass-dark); }
.quiz-dots { display: flex; align-items: center; gap: .35rem; }
.quiz-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: inline-block; }
.quiz-dot.on { background: var(--green-500); }
.quiz-dots-label { font-size: .78rem; color: var(--muted); margin-left: .35rem; font-weight: 700; }
.checklist-item { display: flex; gap: .6rem; align-items: flex-start; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--white); margin-bottom: .45rem; cursor: pointer; }
.checklist-item input { width: 22px; height: 22px; accent-color: var(--green-600); margin-top: .1rem; }
.checklist-item:has(input:checked) { background: var(--ok-bg); border-color: #c8e6d3; }
.task-meta-row { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
.attempt-note { font-size: .8rem; color: var(--muted); }
.evidence-preview { margin-top: .5rem; }
.evidence-preview img { max-width: 100%; border-radius: var(--radius); border: 1px solid var(--line); }
.feedback-ok { background: var(--ok-bg); border-color: #c8e6d3; }
.feedback-warn { background: var(--warn-bg); border-color: #f0dfb4; }
.feedback-title { font-weight: 700; }
.feedback-emoji { font-size: 2rem; }
.feedback-badge { margin-top: .4rem; font-weight: 800; color: var(--green-600); }
.busy { opacity: .7; pointer-events: none; }
.shake { animation: shake .45s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* ── leader console ──────────────────────────────────────────────────── */
.console-split { display: grid; gap: 1rem; grid-template-columns: 1fr; }
@media (min-width: 980px) { .console-split { grid-template-columns: 1.6fr 1fr; align-items: start; } }
.tabs { display: flex; gap: .3rem; border-bottom: 1px solid var(--line); margin-bottom: .9rem; flex-wrap: wrap; }
.tabs button, .tabs a {
  appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: .55rem .8rem;
  font-weight: 700; font-size: .88rem; color: var(--ink-soft); cursor: pointer; text-decoration: none;
}
.tabs button.on, .tabs a.on { border-color: var(--green-500); color: var(--green-700); }
.form-grid { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.form-grid .field { margin-bottom: 0; }
.form-actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: .9rem; }
[data-inline-note] { font-size: .8rem; color: var(--muted); }
[data-inline-note].saved { color: var(--ok); font-weight: 700; }
.review-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); padding: 1rem; margin-bottom: .8rem; }
.review-card.review-done { opacity: .35; transform: scale(.98); transition: all .4s ease; }
.review-head { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: .5rem; }
.review-body { background: var(--paper-2); border-radius: var(--radius-sm); padding: .7rem .8rem; font-size: .9rem; }
.answer-key { font-size: .8rem; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: .25rem .7rem; font-size: .85rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; }
.row-actions { display: flex; gap: .35rem; flex-wrap: wrap; }
.row-actions form { display: inline; }
.tag-draft { background: var(--warn-bg); color: var(--warn); }
.tag-published { background: var(--ok-bg); color: var(--ok); }
.tag-locked { background: var(--danger-bg); color: var(--danger); }
.task-row { display: flex; gap: .6rem; align-items: center; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--white); margin-bottom: .35rem; }
.task-row .task-order { font-weight: 800; color: var(--muted); min-width: 1.6rem; }
.task-row .grow a { font-weight: 700; text-decoration: none; }
.ring-slot { display: inline-flex; }
.timeline-item { display: flex; gap: .7rem; padding: .7rem 0; border-bottom: 1px solid var(--line); }
.timeline-item:last-child { border-bottom: 0; }
.timeline-emoji { font-size: 1.3rem; }
.timeline-when { font-size: .76rem; color: var(--muted); }
.stat-strip { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
@media print { .topbar, .tabbar, .btn, .row-actions { display: none !important; } }


/* ══════════════════════════════════════════════════════════════════════════
   Login — the three patrol mascots (tap your animal to come in)
   ══════════════════════════════════════════════════════════════════════════ */

.mascot-stage {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: .6rem;
  margin: .4rem 0 .2rem;
}

.mascot-card {
  position: relative;
  display: block;
  overflow: hidden;
  aspect-ratio: 3 / 4.15;
  border-radius: 18px;
  border: 2px solid var(--line);
  background:
    radial-gradient(120% 70% at 50% 0%, var(--m-soft, rgba(47,143,91,.14)), transparent 62%),
    linear-gradient(180deg, #ffffff 0%, var(--m-page, #f3f6f2) 100%);
  box-shadow: var(--shadow-sm);
  text-decoration: none;
  color: inherit;
  opacity: 0;
  transform: translateY(14px) scale(.96);
  animation: mascot-in .52s cubic-bezier(.22,.9,.24,1) forwards;
  animation-delay: calc(var(--i, 0) * 90ms);
  transition: transform .32s cubic-bezier(.22,.9,.24,1), box-shadow .32s, border-color .32s,
              filter .32s, opacity .32s;
  -webkit-tap-highlight-color: transparent;
}

@keyframes mascot-in {
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.mascot-card .mascot-glow {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(closest-side at 50% 74%, var(--m-glow, rgba(47,143,91,.5)), transparent 70%);
  opacity: 0; transition: opacity .34s;
}

.mascot-card .mascot-figure {
  position: absolute; left: 50%; bottom: -2%;
  width: 108%; max-width: none; height: auto;
  transform: translateX(-50%);
  transform-origin: 50% 100%;
  animation: mascot-bob 4.6s ease-in-out infinite;
  animation-delay: calc(var(--i, 0) * -1.1s);
  transition: transform .38s cubic-bezier(.22,.9,.24,1), filter .38s;
  filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .16));
  pointer-events: none;
}

@keyframes mascot-bob {
  0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
  50%      { transform: translateX(-50%) translateY(-7px) rotate(-1.2deg); }
}

.mascot-card .mascot-plate {
  position: absolute; left: .35rem; right: .35rem; bottom: .35rem;
  padding: .34rem .3rem .3rem;
  border-radius: 12px;
  background: rgba(255, 255, 255, .93);
  border: 1px solid var(--line);
  text-align: center;
  line-height: 1.25;
  transition: transform .3s, background .3s;
}
.mascot-card .mascot-name { display: block; font-weight: 900; font-size: clamp(1.02rem, 4vw, 1.4rem); letter-spacing: .02em; }
.mascot-card .mascot-en   { display: block; font-size: .68rem; color: var(--m-tint-dark, #2f8f5b); letter-spacing: .02em; }

.mascot-card .mascot-cta {
  position: absolute; top: .4rem; right: .4rem;
  padding: .12rem .45rem; border-radius: 999px;
  background: var(--m-tint, #2f8f5b); color: #fff;
  font-size: .66rem; font-weight: 700;
  opacity: 0; transform: translateY(-5px);
  transition: opacity .26s, transform .26s;
}

/* ── the stand-out moment ─────────────────────────────────────────────── */
.mascot-card:hover,
.mascot-card:focus-visible {
  transform: translateY(-7px) scale(1.035);
  border-color: var(--m-tint, #2f8f5b);
  box-shadow: 0 16px 34px rgba(15, 40, 25, .20);
  outline: none;
}
.mascot-card:hover .mascot-glow,
.mascot-card:focus-visible .mascot-glow { opacity: 1; }
.mascot-card:hover .mascot-figure,
.mascot-card:focus-visible .mascot-figure {
  animation-play-state: paused;
  transform: translateX(-50%) translateY(-12px) scale(1.07);
  filter: drop-shadow(0 12px 16px rgba(0, 0, 0, .22));
}
.mascot-card:hover .mascot-cta,
.mascot-card:focus-visible .mascot-cta { opacity: 1; transform: translateY(0); }
.mascot-card:focus-visible { box-shadow: 0 0 0 3px var(--m-soft, rgba(47,143,91,.3)), 0 16px 34px rgba(15,40,25,.2); }

.mascot-card.is-chosen {
  transform: translateY(-12px) scale(1.1);
  border-color: var(--m-tint, #2f8f5b);
  box-shadow: 0 22px 46px rgba(15, 40, 25, .30);
  z-index: 4;
}
.mascot-card.is-chosen .mascot-glow { opacity: 1; }
.mascot-card.is-chosen .mascot-figure {
  animation: mascot-cheer .5s cubic-bezier(.3,1.5,.5,1) forwards;
  transform: translateX(-50%) translateY(-18px) scale(1.12);
}
.mascot-card.is-chosen .mascot-plate { background: var(--m-tint, #2f8f5b); color: #fff; }
.mascot-card.is-chosen .mascot-en { color: rgba(255, 255, 255, .85); }

@keyframes mascot-cheer {
  0%   { transform: translateX(-50%) translateY(0) scale(1.02); }
  55%  { transform: translateX(-50%) translateY(-26px) scale(1.16) rotate(2deg); }
  100% { transform: translateX(-50%) translateY(-18px) scale(1.12) rotate(0deg); }
}

.mascot-card.is-dimmed {
  opacity: .74;                /* still easy to read — just quietly in the back */
  transform: scale(.97);
}

.mascot-hint { display: none; }        /* the heading says it all now */

@media (max-width: 420px) {
  .mascot-card { aspect-ratio: 3 / 4.4; }
  .mascot-card .mascot-name { font-size: clamp(.95rem, 4.6vw, 1.2rem); }
  .mascot-card .mascot-en { font-size: .6rem; }
}

@media (prefers-reduced-motion: reduce) {
  .mascot-card,
  .mascot-card .mascot-figure { animation: none; opacity: 1; transform: none; }
  .mascot-card .mascot-figure { transform: translateX(-50%); }
  .mascot-card.is-chosen .mascot-figure { transform: translateX(-50%) scale(1.06); animation: none; }
  .mascot-card:hover, .mascot-card:focus-visible, .mascot-card.is-chosen { transform: none; }
}

/* ── the patrol banner on the name-picking page ───────────────────────── */
.patrol-hero {
  display: flex; align-items: center; gap: .8rem;
  margin-bottom: .2rem;
}
.patrol-hero-art {
  width: 96px; flex: 0 0 96px;
  border-radius: 14px;
  background: radial-gradient(circle at 50% 78%, var(--m-soft, rgba(47,143,91,.16)), transparent 70%);
  border: 1px solid var(--line);
}
.patrol-hero-art img { width: 100%; height: auto; display: block; }
.patrol-hero h1 { margin: 0; }

.name-tile {
  opacity: 0;
  animation: name-in .42s cubic-bezier(.22,.9,.24,1) forwards;
  animation-delay: calc(var(--i, 0) * 70ms);
}
@keyframes name-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .name-tile { animation: none; opacity: 1; }
}


/* ══════════════════════════════════════════════════════════════════════════
   Login — one full-screen camp scene, the three animals *are* the buttons
   ══════════════════════════════════════════════════════════════════════════ */

/* a page that paints its own full-bleed background */
body.scene-body { background: #0e2a1a; }
body.scene-body .topbar { display: none; }

.scene-login {
  position: fixed; inset: 0; overflow: hidden;
  background: #0e2a1a;
  --zoom-o: 50% 58%;
}
.scene-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; object-position: var(--x, 50%) 50%;
  transform: scale(1.02);
  transform-origin: var(--zoom-o);
  transition: transform .68s cubic-bezier(.2,.85,.25,1), object-position .55s ease, filter .5s;
  animation: scene-settle 14s ease-in-out infinite alternate;
  user-select: none; -webkit-user-drag: none;
}
@keyframes scene-settle {          /* a very slow breathing pan */
  from { filter: saturate(1) brightness(1); }
  to   { filter: saturate(1.06) brightness(1.02); }
}
.scene-login[data-active] .scene-img {
  transform: scale(1.12);
  animation-play-state: paused;
}

/* a soft darkening that *frames* the animal you are pointing at — light
   enough that the other two are still perfectly visible */
.scene-veil {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(72% 74% at var(--x, 50%) 62%,
              rgba(4, 20, 12, 0) 0 50%,
              rgba(4, 20, 12, .14) 76%,
              rgba(4, 20, 12, .26) 100%);
  opacity: 0; transition: opacity .42s ease;
}
.scene-login[data-active] .scene-veil { opacity: 1; }

/* one gentle wash along the bottom, so white names stay readable on grass */
.scene-scrim {
  position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
  background: linear-gradient(180deg, rgba(6, 22, 14, 0) 0%,
              rgba(6, 22, 14, .16) 52%, rgba(6, 22, 14, .42) 100%);
  pointer-events: none;
}

/* ── the buttons, sitting exactly on the animals ─────────────────────── */
.scene-spot {
  position: absolute;
  top: 6%; height: 88%;
  left: calc(var(--x) - var(--w) / 2);
  width: var(--w);
  border-radius: 26px;
  text-decoration: none; color: inherit;
  -webkit-tap-highlight-color: transparent;
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 3;
}
.scene-spot .spot-glow {
  position: absolute; inset: -6% -10% -4%;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 247, 205, .42),
              rgba(255, 240, 170, .14) 55%, transparent 78%);
  mix-blend-mode: screen;
  opacity: 0; transform: scale(.94);
  transition: opacity .34s, transform .42s cubic-bezier(.2,.85,.25,1);
  pointer-events: none;
}

/* the name is painted on the picture itself — no plate, no frame */
.scene-spot .spot-label {
  position: relative;
  display: flex; flex-direction: column; align-items: center;
  width: max-content; max-width: 150%;
  margin-bottom: 3.2%;
  opacity: 0; transform: translateY(14px);
  animation: spot-in .6s cubic-bezier(.2,.9,.25,1) forwards;
  animation-delay: calc(var(--i, 0) * 130ms + 220ms);
}
@keyframes spot-in { to { opacity: 1; transform: translateY(0); } }

.scene-spot .spot-point {
  font-size: clamp(1rem, 1.8vw, 1.6rem); line-height: 1;
  color: #fff; opacity: 0; margin-bottom: .15rem;
  text-shadow: 0 3px 10px rgba(0, 0, 0, .5);
  animation: spot-bounce 1.4s ease-in-out infinite;
  transition: opacity .3s;
}
@keyframes spot-bounce {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(7px); }
}

.scene-spot .spot-name {
  display: block; text-align: center; line-height: 1;
  color: #fff;
  text-shadow: 0 3px 0 rgba(9, 28, 17, .28),
               0 6px 16px rgba(0, 0, 0, .5),
               0 18px 44px rgba(0, 0, 0, .38);
  transition: transform .34s cubic-bezier(.2,.9,.25,1), text-shadow .34s;
}
/* English patrol name is the headline; the Chinese name sits just under it.
   clamp() keeps it big but never overflowing — long names included. */
.scene-spot .spot-name .en {
  display: block;
  font-weight: 900;
  font-size: clamp(1.6rem, 4.4vw, 3.5rem);
  letter-spacing: .02em;
  text-transform: uppercase;
  white-space: nowrap;
}
.scene-spot .spot-name .zh {
  display: block; margin-top: .3rem;
  font-weight: 700;
  font-size: clamp(.95rem, 1.6vw, 1.35rem);
  letter-spacing: .22em;
  color: rgba(255, 255, 255, .9);
  white-space: nowrap;
}
@media (max-width: 900px) {
  .scene-spot .spot-name .zh { letter-spacing: .12em; }
}

/* pointing at one: it lights up and stands prouder — the others stay visible */
.scene-spot:hover .spot-glow,
.scene-spot:focus-visible .spot-glow { opacity: 1; transform: scale(1); }
.scene-spot:hover .spot-point,
.scene-spot:focus-visible .spot-point { opacity: 1; }
.scene-spot:hover .spot-name,
.scene-spot:focus-visible .spot-name {
  transform: translateY(-7px) scale(1.07);
  text-shadow: 0 3px 0 rgba(9, 28, 17, .22),
               0 0 26px var(--m-glow, rgba(255, 246, 200, .6)),
               0 8px 20px rgba(0, 0, 0, .5),
               0 22px 50px rgba(0, 0, 0, .4);
}
.scene-spot:hover .spot-name .tag,
.scene-spot:focus-visible .spot-name .tag { color: #fff; }
.scene-spot:focus-visible { outline: 3px solid #fff; outline-offset: 6px; border-radius: 22px; }

/* the moment it is chosen */
.scene-login[data-chosen] .scene-img { transform: scale(1.16); filter: saturate(1.08) brightness(1.03); }
.scene-login[data-chosen] .scene-veil { opacity: 1; }
.scene-spot.is-chosen .spot-glow { opacity: 1; transform: scale(1.04); }
.scene-spot.is-chosen .spot-point { opacity: 0; }
.scene-spot.is-chosen .spot-name {
  transform: translateY(-14px) scale(1.16);
  text-shadow: 0 3px 0 rgba(9, 28, 17, .2),
               0 0 34px var(--m-glow, rgba(255, 246, 200, .7)),
               0 10px 24px rgba(0, 0, 0, .52);
}
.scene-spot.is-dimmed { opacity: .82; transition: opacity .4s; }

/* ── the few words that live on the picture ──────────────────────────── */
.scene-hud { position: absolute; z-index: 3; color: #fff; }
.scene-hud.tl { top: 1rem; left: 1.2rem; text-shadow: 0 3px 12px rgba(0,0,0,.5); }
.scene-hud.tl h1 { margin: 0; font-size: 1.35rem; letter-spacing: .01em; }
.scene-hud.tl p { margin: .15rem 0 0; font-size: .82rem; color: #d9ead9; }
.scene-hud.bc {
  bottom: 1.1rem; left: 50%; transform: translateX(-50%);
  text-align: center; pointer-events: none; max-width: min(760px, 90vw);
}
.scene-prompt { margin: 0; line-height: 1.05; }
.scene-prompt .zh {
  display: block;
  font-size: clamp(1.15rem, 2.4vw, 2rem);
  font-weight: 900; letter-spacing: .18em; color: #fff;
  text-shadow: 0 2px 0 rgba(9, 28, 17, .32),
               0 6px 18px rgba(0, 0, 0, .5),
               0 16px 40px rgba(0, 0, 0, .35);
  transition: text-shadow .34s, transform .34s;
}
.scene-prompt .en {
  display: block; margin-top: .35rem;
  font-size: clamp(.68rem, 1.05vw, .92rem);
  font-weight: 700; letter-spacing: .3em; text-transform: uppercase;
  color: rgba(255, 255, 255, .82);
  transition: color .34s;
}
.scene-prompt.is-live .zh { transform: translateY(-2px); }
.scene-prompt.is-live .en { color: #fff; }

.scene-hud.br {
  bottom: 1rem; right: 1.2rem; display: flex; gap: .45rem; align-items: center;
  flex-wrap: wrap; justify-content: flex-end; max-width: 46vw;
}
/* the leaders' door: bottom-right, and a touch more prominent than a chip */
.scene-leader {
  padding: .55rem 1.15rem;
  font-size: .95rem; font-weight: 800;
  background: rgba(8, 26, 16, .72);
  border: 2px solid rgba(255, 255, 255, .45);
  box-shadow: 0 10px 26px rgba(6, 26, 14, .32);
}
.scene-leader:hover, .scene-leader:focus-visible {
  background: #fff; color: #16301f; border-color: #fff;
}
.scene-hud.bl { bottom: 1rem; left: 1.2rem; display: flex; gap: .4rem; flex-wrap: wrap; }
.scene-link, .scene-tile {
  display: inline-flex; align-items: center; gap: .35rem;
  padding: .38rem .8rem; border-radius: 999px;
  background: rgba(8, 26, 16, .55); color: #fff;
  border: 1px solid rgba(255,255,255,.24);
  font-size: .8rem; font-weight: 600; text-decoration: none;
  backdrop-filter: blur(4px);
  transition: background .25s, transform .25s, border-color .25s;
}
.scene-link:hover, .scene-link:focus-visible,
.scene-tile:hover, .scene-tile:focus-visible {
  background: rgba(255,255,255,.94); color: #16301f; transform: translateY(-2px);
}
.scene-tile { font-weight: 700; }
.scene-lang { padding: .38rem .62rem; }

/* the little tray of demo shortcuts — kept out of the way */
.scene-mini { display: flex; gap: .3rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.scene-mini form { display: inline; }

/* ── narrow & tall windows: still the scene, in three columns ────────── */
.mascot-fallback { display: none; }

@media (max-width: 900px), (max-aspect-ratio: 4/3) {
  /* the picture can no longer be read as one wide shot, so each column slides
     it to its own animal — pointing at the otter fills the screen with otter */
  .scene-spot {
    left: calc((var(--col, 1) - 1) * 33.3333%);
    width: 33.3333%;
    top: 4%; height: 90%;
  }
  .scene-spot .spot-label { max-width: 112%; margin-bottom: 6%; }
  .scene-spot .spot-name .en { font-size: clamp(1.15rem, 6.2vw, 2.1rem); }
  .scene-spot .spot-name .zh { font-size: clamp(.72rem, 3vw, 1rem); letter-spacing: .1em; }
  .spot-glow { inset: -4% -6% -2%; }
  .scene-hud.tl h1 { font-size: 1.05rem; }
  .scene-hud.tl p { display: none; }
  .scene-hud.bc { bottom: .7rem; max-width: 94vw; }
  .scene-prompt .zh { font-size: clamp(1rem, 5.4vw, 1.5rem); letter-spacing: .12em; }
  .scene-prompt .en { font-size: clamp(.6rem, 2.6vw, .8rem); letter-spacing: .22em; }
  .scene-hud.br { max-width: 60vw; bottom: .6rem; right: .7rem; gap: .3rem; }
  .scene-link, .scene-tile { font-size: .72rem; padding: .3rem .6rem; }
  .scene-hud.bl { bottom: .6rem; left: .7rem; }
}

/* only a really tiny window falls back to the cards */
@media (max-width: 360px) {
  .scene-login { display: none; }
  .mascot-fallback { display: flex; }
}


/* ── the first-time ask (GET /welcome) ──────────────────────────────── */
.welcome-screen { padding: 1.5rem; min-height: 100vh; display: flex; }
.welcome-card {
  margin: auto; width: min(620px, 94vw); padding: 1.6rem;
  border-top: 5px solid var(--m-tint, var(--green-500));
}
.welcome-hero { display: flex; align-items: center; gap: .9rem; }
.welcome-art {
  width: 104px; flex: 0 0 104px; border-radius: 14px;
  background: radial-gradient(circle at 50% 78%, var(--m-soft, rgba(47,143,91,.16)), transparent 70%);
  border: 1px solid var(--line);
  animation: welcome-bob 4.6s ease-in-out infinite;
}
.welcome-art img { width: 100%; height: auto; display: block; }
@keyframes welcome-bob {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-6px) rotate(-1deg); }
}
@media (prefers-reduced-motion: reduce) { .welcome-art { animation: none; } }
@media (max-width: 420px) { .welcome-art { width: 74px; flex-basis: 74px; } }


/* ── names read English-first, Chinese right beside them ────────────── */
.nm { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: .35em; }
.nm .nm-en { font-weight: 800; letter-spacing: .01em; }
.nm .nm-zh { font-size: .82em; font-weight: 600; opacity: .72; letter-spacing: .02em; }
.card .nm, .lb-row .nm { flex-wrap: nowrap; }


/* the name picker: English patrol name leads, Chinese under it */
.patrol-zh { font-size: .95rem; font-weight: 700; letter-spacing: .18em; color: var(--m-tint, #2f8f5b); margin-top: .1rem; }


/* ── the group logo ──────────────────────────────────────────────────── */
/* the group mark: a quiet badge in the top-right corner */
.scene-hud.tr { top: .9rem; right: 1.2rem; text-align: right; }
.scene-logo {
  display: inline-flex; align-items: center; justify-content: center;
  padding: .3rem .55rem;
  border-radius: 12px;
  background: rgba(255, 255, 255, .78);
  border: 1px solid rgba(255, 255, 255, .5);
  box-shadow: 0 6px 18px rgba(6, 26, 14, .18);
  opacity: .92;
}
.scene-logo:hover { opacity: 1; background: rgba(255, 255, 255, .95); }
.scene-logo img { width: clamp(84px, 9vw, 132px); height: auto; display: block; }

.brand-logo { height: 34px; width: auto; display: block; }
.topbar .brand { align-items: center; }

.card-logo { width: min(230px, 62%); height: auto; margin: 0 auto .6rem; display: block; }

@media (max-width: 900px) {
  .scene-hud.tr { top: .6rem; right: .7rem; }
  .scene-logo { padding: .22rem .42rem; border-radius: 10px; }
  .scene-logo img { width: clamp(70px, 20vw, 104px); }
  .brand-logo { height: 28px; }
}
