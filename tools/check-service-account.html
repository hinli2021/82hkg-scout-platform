<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>檢查服務帳戶金鑰 · 82 旅童軍平台</title>
<style>
  :root { --ink:#17212b; --muted:#5b6b7c; --line:#dde4ec; --ok:#1c7c4a; --bad:#b3261e; --warn:#a15c00; }
  * { box-sizing:border-box }
  body { margin:0; padding:1.2rem 1rem 3rem; font-family:-apple-system,"PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
         color:var(--ink); background:#f4f7fa; line-height:1.6 }
  .wrap { max-width:820px; margin:0 auto }
  h1 { font-size:1.35rem; margin:.2rem 0 .3rem }
  p.lead { margin:0 0 1rem; color:var(--muted); font-size:.95rem }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:1rem; margin-bottom:1rem }
  textarea { width:100%; min-height:190px; padding:.7rem; font-family:ui-monospace,Menlo,Consolas,monospace;
             font-size:.82rem; border:1px solid var(--line); border-radius:8px; resize:vertical }
  .row { display:flex; gap:.6rem; flex-wrap:wrap; margin-top:.7rem }
  button { font:inherit; padding:.55rem 1rem; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer }
  button.primary { background:#1b5e8c; color:#fff; border-color:#1b5e8c; font-weight:600 }
  .verdict { border-radius:10px; padding:.8rem .9rem; margin-top:1rem; font-weight:600 }
  .verdict.ok { background:#e7f6ec; color:var(--ok); border:1px solid #bfe3cb }
  .verdict.bad { background:#fdecea; color:var(--bad); border:1px solid #f4c7c3 }
  .verdict.warn { background:#fff6e5; color:var(--warn); border:1px solid #f0dcb4 }
  ul.checks { list-style:none; padding:0; margin:.8rem 0 0; font-size:.93rem }
  ul.checks li { padding:.3rem 0; border-top:1px dashed var(--line) }
  ul.checks li:first-child { border-top:0 }
  .fix { color:var(--muted) }
  code { background:#eef3f8; padding:.1rem .3rem; border-radius:4px; font-size:.86em }
  .sample { font-family:ui-monospace,monospace; font-size:.78rem; color:var(--muted); word-break:break-all }
  .note { font-size:.85rem; color:var(--muted) }
  .hidden { display:none }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔑 檢查服務帳戶金鑰</h1>
  <p class="lead">把你在 Vercel 貼進 <code>GOOGLE_SERVICE_ACCOUNT_JSON</code> 的那段內容貼到下面，
     即時看它是不是正確。也可以直接貼整份 <code>.json</code> 檔的內容。</p>

  <div class="card">
    <textarea id="value" spellcheck="false" placeholder='應該由 { 開始，到 } 結束，例如：&#10;{&#10;  "type": "service_account",&#10;  "project_id": "82hkg-scout",&#10;  "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEv…\n-----END PRIVATE KEY-----\n",&#10;  "client_email": "scout-platform@82hkg-scout.iam.gserviceaccount.com"&#10;}'></textarea>
    <div class="row">
      <button class="primary" id="check">檢查</button>
      <button id="repair">修正換行後顯示</button>
      <button id="clear">清除</button>
    </div>
    <div class="note" style="margin-top:.6rem">
      🔒 所有檢查都在你自己的瀏覽器內完成，內容不會上傳到任何地方（這個檔案本身沒有連線功能）。
    </div>
  </div>

  <div id="out" class="hidden"></div>

  <div class="card note">
    <strong>要貼的是甚麼？</strong> 到 Google Cloud → IAM 與管理 → 服務帳戶 → 金鑰，
    按「新增金鑰 → 建立新的金鑰 → JSON」，電腦會下載一個檔案（例如
    <code>82hkg-scout-4f2c1a9b.json</code>）。用記事本打開它，<strong>全選 → 複製 → 貼上</strong>。
    貼上的是<strong>檔案的內容</strong>，不是檔案的路徑。
  </div>
</div>

<script>
(function () {
  "use strict";
  var out = document.getElementById("out");
  var box = document.getElementById("value");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
  }

  // 把字串內真正的換行還原成 \n（這是從某些編輯器複製時最常見的破壞）
  function unescapeRawNewlines(text) {
    var res = "", inString = false, escaped = false, i, ch;
    for (i = 0; i < text.length; i += 1) {
      ch = text[i];
      if (escaped) { res += ch; escaped = false; continue; }
      if (ch === "\\") { res += ch; escaped = true; continue; }
      if (ch === '"') { inString = !inString; res += ch; continue; }
      if (inString && ch === "\n") { res += "\\n"; continue; }
      if (inString && ch === "\r") { continue; }
      if (inString && ch === "\t") { res += "\\t"; continue; }
      res += ch;
    }
    return res;
  }

  function tryParse(text) {
    try { return { ok: true, value: JSON.parse(text) }; }
    catch (err) {
      try { return { ok: true, value: JSON.parse(unescapeRawNewlines(text)), repaired: true }; }
      catch (err2) { return { ok: false, first: err, second: err2 }; }
    }
  }

  function render(rows, verdictClass, verdictText, extraHtml) {
    var html = '<div class="card"><div class="verdict ' + verdictClass + '">' + verdictText + "</div>";
    if (rows && rows.length) {
      html += '<ul class="checks">';
      rows.forEach(function (r) { html += "<li>" + r + "</li>"; });
      html += "</ul>";
    }
    if (extraHtml) { html += extraHtml; }
    html += "</div>";
    out.innerHTML = html;
    out.classList.remove("hidden");
  }

  function looksLikePath(text) {
    return /^[A-Za-z]:\\/.test(text) || /^\/|^\.\//.test(text) || /\.json$/.test(text) && text.indexOf("{") === -1;
  }

  function check() {
    var raw = box.value.trim();
    if (!raw) { render([], "warn", "尚未貼上內容。"); return; }

    var rows = [];
    rows.push("長度：<strong>" + raw.length + "</strong> 個字元（一份完整的金鑰通常 2200–2500 個字元）");
    rows.push("開頭：<span class=\"sample\">" + esc(raw.slice(0, 40)) + "</span>");
    rows.push("結尾：<span class=\"sample\">" + esc(raw.slice(-40)) + "</span>");

    if (looksLikePath(raw)) {
      render(rows, "bad", "❌ 這看起來是檔案路徑，不是檔案內容。",
        '<p class="fix">↳ 怎樣做：打開那個 <code>.json</code> 檔（記事本／文字編輯器），全選複製，再貼到這裡和 Vercel。</p>');
      return;
    }

    // 前後被引號包住：新版程式已經可以自動處理，但仍然建議改好
    var quoted = raw.length > 2 && raw.charAt(0) === '"' && raw.charAt(raw.length - 1) === '"';
    if (quoted) {
      rows.push("偵測到前後多了引號 <code>\"</code>（程式會自動忽略，但建議移除）");
    }

    var result = tryParse(raw);
    if (!result.ok) {
      var message = String(result.first && result.first.message || result.first);
      render(rows, "bad", "❌ 不是有效的 JSON：" + esc(message),
        '<p class="fix">↳ 最常見的三個原因：只複製了一部分（結尾應該見到 <code>}</code>）；' +
        "把檔案路徑當成內容貼上；複製時中間被截斷。<br>" +
        "↳ 怎樣做：回到 Google Cloud 重新下載一次金鑰，用記事本全選複製，重新貼上。</p>");
      return;
    }

    var key = result.value;
    if (result.repaired) {
      rows.push("<strong>內容裡有真正的換行</strong>（複製時把 <code>\\n</code> 變成實際斷行）—— 已自動還原，程式重新部署後也會自己處理");
    }
    if (typeof key !== "object" || key === null) {
      render(rows, "bad", "❌ 內容不是一組金鑰物件。", '<p class="fix">↳ 應該以 <code>{</code> 開始、<code>}</code> 結束。</p>');
      return;
    }
    if (key.installed || key.web) {
      render(rows, "bad", "❌ 這是「OAuth 用戶端」的金鑰，不是「服務帳戶」金鑰。",
        '<p class="fix">↳ 怎樣做：到 Google Cloud → IAM 與管理 → <strong>服務帳戶</strong> → 金鑰 → 新增金鑰 → JSON。</p>');
      return;
    }

    var problems = [];
    rows.push((key.type === "service_account" ? "✅" : "⚠️") + " type：" + esc(key.type || "（缺少）"));
    rows.push((key.client_email ? "✅" : "❌") + " client_email：" + esc(key.client_email || "（缺少）"));
    if (key.client_email && !/@[^@]+\.iam\.gserviceaccount\.com$/.test(key.client_email)) {
      problems.push("client_email 不像服務帳戶電郵（通常結尾是 <code>.iam.gserviceaccount.com</code>）");
    }
    var pk = String(key.private_key || "");
    rows.push((pk.indexOf("BEGIN PRIVATE KEY") !== -1 && pk.indexOf("END PRIVATE KEY") !== -1 ? "✅" : "❌") +
      " private_key：" + (pk ? esc(pk.slice(0, 34)) + "…" : "（缺少）"));
    rows.push((key.project_id ? "✅" : "⚠️") + " project_id：" + esc(key.project_id || "（缺少）"));
    rows.push((key.token_uri ? "✅" : "⚠️") + " token_uri：" + esc(key.token_uri || "（缺少）"));

    var email = key.client_email || "";
    if (key.type !== "service_account") { problems.push("type 不是 <code>service_account</code>"); }
    if (!pk || pk.indexOf("BEGIN PRIVATE KEY") === -1) { problems.push("private_key 不完整（貼上時被截斷）"); }

    var copyBtn = '<p class="fix">要貼進 Vercel 的值：上面那段內容整份複製即可（由 <code>{</code> 到 <code>}</code>，前後不要加引號）。' +
      (quoted || result.repaired ? "程式已能自動處理引號與換行，但仍建議貼上原始內容。" : "") + "</p>";

    if (problems.length) {
      render(rows, "warn", "⚠️ 有效 JSON，但仍有問題。", '<p class="fix">↳ ' + problems.join("；") + "</p>" + copyBtn);
      return;
    }
    render(rows, "ok",
      "✅ 這組金鑰看起來正確 —— 可以貼進 Vercel 的 GOOGLE_SERVICE_ACCOUNT_JSON。",
      '<p class="fix">↳ 記住最後一步：將試算表<strong>共用</strong>給 <code>' + esc(email) +
      "</code>（權限「編輯者」），然後在 Vercel 按 Redeploy。<br>" +
      "↳ 之後打開 <code>&lt;你的網址&gt;/health</code>，看到「資料儲存在 Google 試算表」就代表成功。</p>" + copyBtn);
  }

  document.getElementById("check").addEventListener("click", check);
  document.getElementById("clear").addEventListener("click", function () {
    box.value = ""; out.classList.add("hidden");
  });
  document.getElementById("repair").addEventListener("click", function () {
    var raw = box.value.trim();
    if (!raw) { render([], "warn", "尚未貼上內容。"); return; }
    var fixed = unescapeRawNewlines(raw);
    var parsed = tryParse(fixed);
    if (parsed.ok) {
      box.value = fixed;
      render(["已把字串內真正的換行還原成 <code>\\n</code>；上面的內容可以直接複製。"],
        "ok", "✅ 已修正換行問題。", null);
    } else {
      render([], "bad", "❌ 除了換行，還有其他問題：" +
        esc(String(parsed.first && parsed.first.message || parsed.first)), null);
    }
  });
  box.addEventListener("paste", function () { out.classList.add("hidden"); });
})();
</script>
</body>
</html>
